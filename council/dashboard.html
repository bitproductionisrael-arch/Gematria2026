<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RovGrid Council</title><style>body{background:#0b1220;color:#e5edf8;font:16px system-ui;margin: auto;max-width:900px;padding:20px}h1{color:#8fc5ff}section,article{background:#142238;border:1px solid #30435e;border-radius:12px;padding:16px;margin:12px 0}a{color:#8fc5ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left;font:14px system-ui}button{padding:10px;border-radius:8px}small{color:#aabbd0}</style><h1>ROVGRID — לוח מחקר</h1><button onclick="load()">רענון</button> <small id="stamp"></small><section><h2>מצב החוקרים</h2><div id="states"></div></section><section><h2>הכרעות ותוצאות</h2><div id="decisions"></div></section><section><h2>עדכונים והתרעות</h2><div id="messages"></div></section><section><h2>נושאי המחקר</h2><div id="index"></div></section><script>
const root='https://api.github.com/repos/bitproductionisrael-arch/Gematria2026/contents/council/';
const raw='https://raw.githubusercontent.com/bitproductionisrael-arch/Gematria2026/main/council/';
const gh='https://github.com/bitproductionisrael-arch/Gematria2026/blob/main/council/';
async function get(p){let r=await fetch(raw+p,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.text()}
function el(tag,s,parent){let e=document.createElement(tag);e.textContent=s;parent.append(e);return e}
function link(p,parent){let a=el('a',p,parent);a.href=gh+p;a.target='_blank';a.rel='noopener'}
async function list(p,id){let box=document.getElementById(id);box.replaceChildren();try{let r=await fetch(root+p,{cache:'no-store'});if(r.status===404){el('p','אין רשומות עדיין',box);return}if(!r.ok)throw Error(r.status);let files=(await r.json()).filter(x=>x.type==='file'&&x.name.endsWith('.md')).reverse();for(let f of files.slice(0,20)){let a=el('article','',box);link(p+'/'+f.name,a);try{let s=await get(p+'/'+f.name);el('pre',s.slice(0,1400),a)}catch(e){el('p','לא ניתן לקרוא את הרשומה',a)}}if(!files.length)el('p','אין רשומות עדיין',box)}catch(e){el('p','שגיאת טעינה: '+e.message,box)}}
async function load(){let b=document.getElementById('states');b.replaceChildren();for(let role of ['SPIRIT','MATTER','WORK']){let a=el('article','',b);el('h3',role,a);try{let s=JSON.parse(await get('state/'+role+'.json'));el('p',s.status||'לא ידוע',a);for(let t of s.open_tasks||[])el('p',typeof t==='string'?t:JSON.stringify(t),a);for(let t of (s.experiments||[]).slice(-3))el('pre',JSON.stringify(t,null,2),a);link('state/'+role+'.json',a)}catch(e){el('p','שגיאת טעינה: '+e.message,a)}}await Promise.all([list('decisions','decisions'),list('messages','messages')]);let i=document.getElementById('index');i.replaceChildren();try{el('pre',await get('INDEX.md'),i)}catch(e){el('p','שגיאת טעינה',i)}document.getElementById('stamp').textContent='בדיקה: '+new Date().toLocaleString('he-IL')}
load();</script></html>

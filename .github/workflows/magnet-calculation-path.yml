name: One-time Magnet Calculation Path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add compact calculation path to magnet copy
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="function minimalResultText(r){\n const q=document.getElementById('q').value.trim();\n if(r?.milui){\n  const expansion=miluiResultExpansion(r);\n  return `${q} = ${expansion} = ${fmt(r.total)} (${minimalMethodName(r)})`\n }\n return `${q} = ${fmt(r.total)} (${minimalMethodName(r)})`\n}"
          new="function magnetTokenText(r,w){\n const m=r.method;\n if(m.transform){\n  return w.vals.map(v=>fmt(v)).join(' + ')+' = '+fmt(sum(w.vals))\n }\n if(m.fold==='word'){\n  const base=w.toks.map((t,i)=>t.label+'='+fmt(w.baseVals[i])).join(' + ');\n  return base+' → '+fmt(w.folded)\n }\n return w.toks.map((t,i)=>{\n  const sub=m.sub&&m.sub[t.base]?(t.label+'→'+m.sub[t.base]):t.label;\n  return sub+'='+fmt(w.baseVals[i])\n }).join(' + ')\n}\nfunction magnetBreakdown(r){\n if(r?.milui)return miluiResultExpansion(r);\n if(!r?.words?.length)return'';\n const multi=r.words.length>1;\n return r.words.map(w=>{\n  const expr=magnetTokenText(r,w);\n  return multi?(w.raw+' ['+expr+']'):expr\n }).join(' + ')\n}\nfunction minimalResultText(r){\n const q=document.getElementById('q').value.trim();\n const breakdown=magnetBreakdown(r);\n return breakdown\n  ? `${q} = ${breakdown} = ${fmt(r.total)} (${minimalMethodName(r)})`\n  : `${q} = ${fmt(r.total)} (${minimalMethodName(r)})`\n}"
          assert old in s, "minimalResultText anchor missing"
          s=s.replace(old,new,1)
          anchor="console.assert(T('עמית מייק רוב','he','regular')===888,'Hebrew regular 888');"
          extra="console.assert(T('עמית','he','perati')===166600,'Amit Perati 166600');"
          assert anchor in s, "self-test anchor missing"
          s=s.replace(anchor,anchor+"\n"+extra,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Include calculation path in magnet copy"
          git push origin main
name: One-time Clean Poster Export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build clean selected-results poster export
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="async function savePanelAsPng(el,name){\n if(!el)return false;\n try{\n  const r=el.getBoundingClientRect();\n  const cssW=Math.max(1,Math.round(r.width)),cssH=Math.max(1,Math.round(r.height));\n  const maxPixels=12000000;let scale=Math.min(2.25,Math.max(1.5,window.devicePixelRatio||1.5));\n  if(cssW*cssH*scale*scale>maxPixels)scale=Math.max(1,Math.sqrt(maxPixels/(cssW*cssH)));\n  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(cssW*scale));c.height=Math.max(1,Math.round(cssH*scale));\n  const ctx=c.getContext('2d',{alpha:false});if(!ctx)throw new Error('Canvas unavailable');ctx.scale(scale,scale);ctx.fillStyle=getComputedStyle(document.body).backgroundColor||'#0b0f14';ctx.fillRect(0,0,cssW,cssH);drawDomSnapshot(el,ctx,scale);\n  const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png',1));if(!blob)throw new Error('PNG blob failed');\n  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeFileName(name)+'.png';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);return true;\n }catch(e){console.error(e);toast('שגיאה בצילום הטאב');return false}\n}"
          new="async function savePanelAsPng(el,name){\n if(!el)return false;\n try{\n  const r=el.getBoundingClientRect();\n  const cssW=Math.max(1,Math.round(r.width)),cssH=Math.max(1,Math.round(r.height));\n  const maxPixels=12000000;let scale=Math.min(2.25,Math.max(1.5,window.devicePixelRatio||1.5));\n  if(cssW*cssH*scale*scale>maxPixels)scale=Math.max(1,Math.sqrt(maxPixels/(cssW*cssH)));\n  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(cssW*scale));c.height=Math.max(1,Math.round(cssH*scale));\n  const ctx=c.getContext('2d',{alpha:false});if(!ctx)throw new Error('Canvas unavailable');ctx.scale(scale,scale);ctx.fillStyle=getComputedStyle(document.body).backgroundColor||'#0b0f14';ctx.fillRect(0,0,cssW,cssH);drawDomSnapshot(el,ctx,scale);\n  const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png',1));if(!blob)throw new Error('PNG blob failed');\n  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeFileName(name)+'.png';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);return true;\n }catch(e){console.error(e);toast('שגיאה בצילום הטאב');return false}\n}\nfunction posterRound(ctx,x,y,w,h,r,fill,stroke){\n ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}\n if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}\n}\nfunction posterText(ctx,text,x,y,size,weight,color,align,dir,maxWidth){\n weight=weight||'500';color=color||'#eef3f8';align=align||'right';dir=dir||'rtl';\n ctx.save();ctx.font=weight+' '+size+'px system-ui,-apple-system,Segoe UI,Arial,sans-serif';ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='top';ctx.direction=dir;ctx.fillText(String(text),x,y,maxWidth);ctx.restore()\n}\nfunction posterBadge(ctx,text,x,y,color,border){\n color=color||'#9fb0c2';border=border||'#344353';ctx.save();ctx.font='600 19px system-ui,-apple-system,Segoe UI,Arial,sans-serif';const w=Math.ceil(ctx.measureText(text).width)+28;posterRound(ctx,x-w,y,w,34,17,'#0b1219',border);posterText(ctx,text,x-14,y+6,19,'600',color,'right','rtl',w-22);ctx.restore();return w\n}\nfunction selectedResults(){return state.selectedMethods.map(function(k){return current.results.find(function(r){return r.method.key===k})}).filter(Boolean)}\nfunction posterWord(ctx,r,w,x,y,width){\n posterText(ctx,w.raw,x+width-20,y,24,'800','#f3f7fb','right','rtl',width-40);\n const items=r.milui?w.parts.map(function(p){return {letter:p.letter,value:p.value,sub:p.name}}):w.toks.map(function(t,i){return {letter:t.label,value:w.baseVals[i],sub:r.method.sub&&r.method.sub[t.base]?(t.label+'→'+r.method.sub[t.base]):''}});\n const gap=8,inner=width-40,count=Math.max(1,items.length),chipW=Math.max(58,Math.min(92,(inner-gap*(count-1))/count)),chipH=72;\n let cx=x+width-20-chipW,cy=y+38;\n items.forEach(function(item){\n  if(cx<x+20){cx=x+width-20-chipW;cy+=chipH+8}\n  posterRound(ctx,cx,cy,chipW,chipH,12,'#091018','#273746');\n  posterText(ctx,item.letter,cx+chipW/2,cy+9,25,'800','#eef3f8','center','rtl',chipW-10);\n  if(item.sub)posterText(ctx,item.sub,cx+chipW/2,cy+35,11,'500','#8e9aa8','center','rtl',chipW-8);\n  posterText(ctx,item.value,cx+chipW/2,cy+(item.sub?50:42),17,'800','#bfe0ff','center','ltr',chipW-10);\n  cx-=chipW+gap\n });\n const totalY=cy+chipH+10;\n const subtotal=r.milui?w.subtotal:(r.method.fold==='word'?w.folded:(r.method.transform?sum(w.vals):sum(w.baseVals)));\n posterText(ctx,'סכום',x+width-64,totalY+2,16,'500','#8e9aa8','right','rtl',80);\n posterText(ctx,subtotal,x+width-20,totalY,22,'850','#eef3f8','right','ltr',80);\n if(r.method.transform)posterText(ctx,r.method.transformName+': '+w.vals.join(' + ')+' = '+sum(w.vals),x+20,totalY+2,13,'500','#9fb0c2','left','ltr',width-150);\n return totalY+38\n}\nfunction posterCard(ctx,r,x,y,w,h){\n posterRound(ctx,x,y,w,h,24,'#101821','#314052');\n posterText(ctx,r.method.name,x+w-28,y+22,22,'800','#e9f1f8','right','rtl',w-150);\n posterText(ctx,r.total,x+28,y+18,54,'900','#63a9ff','left','ltr',160);\n const a=analyzeNumber(r.total);let bx=x+w-28,by=y+64;\n const idx=a.prime?('Prime #'+a.primeIndex):(a.compositeIndex?('Composite #'+a.compositeIndex):'');\n if(idx)bx-=posterBadge(ctx,idx,bx,by,a.prime?'#b9f4c8':'#d5dde6',a.prime?'#2c6240':'#344353')+8;\n const hit=corpusHits(r.total)[0];if(hit)bx-=posterBadge(ctx,hit.label,bx,by,'#ffe2a0','#6f5a2d')+8;\n let yy=y+118;\n (r.words||[]).forEach(function(word){if(yy<=y+h-100)yy=posterWord(ctx,r,word,x+14,yy,w-28)});\n posterText(ctx,'✓ חישוב מאומת',x+w-26,y+h-34,15,'650','#b9f4c8','right','rtl',180);\n}\nasync function saveSelectedPoster(){\n const rows=selectedResults();if(!rows.length)return false;\n try{\n  const n=rows.length,cols=n<=3?n:3,rowCount=Math.ceil(n/cols);\n  const W=1800,H=rowCount===1?1000:1380,pad=70,header=150,gap=26;\n  const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d',{alpha:false});if(!ctx)throw new Error('Canvas unavailable');\n  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#081018');g.addColorStop(.55,'#0c141d');g.addColorStop(1,'#080d13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n  ctx.strokeStyle='#1c2a37';ctx.lineWidth=1;for(let i=0;i<9;i++){ctx.beginPath();ctx.moveTo(0,110+i*120);ctx.lineTo(W,20+i*120);ctx.stroke()}\n  const q=document.getElementById('q').value;\n  posterText(ctx,q,W-pad,38,58,'900','#f4f7fb','right','rtl',W-2*pad);\n  posterText(ctx,'השוואת גימטריה',W-pad,105,20,'650','#8e9aa8','right','rtl',220);\n  posterText(ctx,'Gematria Research Engine',pad,108,18,'600','#5fd3cf','left','ltr',300);\n  const availW=W-2*pad-gap*(cols-1),cardW=availW/cols,availH=H-header-pad-gap*(rowCount-1),cardH=availH/rowCount;\n  rows.forEach(function(r,i){const col=i%cols,row=Math.floor(i/cols),x=pad+col*(cardW+gap),y=header+row*(cardH+gap);posterCard(ctx,r,x,y,cardW,cardH)});\n  const blob=await new Promise(function(resolve){c.toBlob(resolve,'image/png',1)});if(!blob)throw new Error('PNG blob failed');\n  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeFileName(q+' - selected')+'.png';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2500);return true;\n }catch(e){console.error(e);toast('שגיאה ביצירת תמונת ההשוואה');return false}\n}"
          assert old in s
          s=s.replace(old,new,1)
          old="document.getElementById('saveView').addEventListener('click',async()=>{const el=activeExportTarget();const selectedOnly=state.tab==='results'&&state.selectionTouched;const name=document.getElementById('q').value+' - '+(selectedOnly?'selected':state.tab);const ok=await savePanelAsPng(el,name);if(ok)toast(selectedOnly?'נשמר צילום של הבחירה בלבד':'נשמר צילום של הטאב בלבד')});"
          new="document.getElementById('saveView').addEventListener('click',async()=>{if(state.tab==='results'&&selectedResults().length){const ok=await saveSelectedPoster();if(ok)toast('נשמרה תמונת השוואה מעוצבת');return}const el=activePanel();const name=document.getElementById('q').value+' - '+state.tab;const ok=await savePanelAsPng(el,name);if(ok)toast('נשמר צילום של הטאב')});"
          assert old in s
          s=s.replace(old,new,1)
          old="console.assert(T('עמית מייק רוב','he','regular')===888,'Hebrew regular 888');"
          new="console.assert(T('חכמה','he','regular')===73,'Hokhmah regular 73');\nconsole.assert(T('חכמה','he','ordinal')===37,'Hokhmah ordinal 37');\nconsole.assert(T('חכמה','he','reverseOrdinal')===55,'Hokhmah reverse ordinal 55');\nconsole.assert(T('עמית מייק רוב','he','regular')===888,'Hebrew regular 888');"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit export fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Create dedicated clean poster export for selected results"
          git push origin main
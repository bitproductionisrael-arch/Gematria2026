name: One-time Mobile Flow Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix mobile spacing and growing comparison stage
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="@media(max-width:900px){.results-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.method-pane{max-height:280px}.category-tabs{display:grid!important}.method-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));max-height:190px;overflow:auto}.mobile-method{display:none!important}.detail-pane.multi-mode{padding:9px}.multi-detail-grid{grid-template-columns:1fr}.stage-head{position:sticky;top:0;background:#0c1219;z-index:3;padding-block:5px}}"
          new="@media(max-width:900px){\n html,body{height:auto;min-height:100%;overflow:auto}\n .app{height:auto;min-height:100vh;overflow:visible}\n .workspace{min-height:0;overflow:visible;padding:6px}\n .tab-panel,.tab-panel.active{height:auto;min-height:0;overflow:visible}\n .panel{height:auto;min-height:0;overflow:visible}\n .results-layout{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto;align-content:start}\n .method-pane{max-height:280px}\n .category-tabs{display:grid!important}\n .method-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));max-height:190px;overflow:auto}\n .mobile-method{display:none!important}\n .detail-pane.multi-mode{height:auto;overflow:visible;padding:9px}\n .multi-detail-grid{height:auto;min-height:0;overflow:visible;grid-template-columns:1fr;align-content:start}\n .multi-detail-card{height:auto;min-height:0}\n .stage-head{position:static;background:transparent;z-index:auto;padding-block:5px}\n}"
          assert old in s, "missing anchor: mobile expansion"
          s=s.replace(old,new,1)
          old="@media(max-width:820px){\n  :root{--top:126px;--tabs:46px}.topbar{grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:7px 8px;gap:6px}.brand{display:none}.querybox{grid-column:1/2}.top-actions{grid-column:2/3;grid-row:1/2}.queryside{min-width:100px}.main-tabs{grid-template-columns:repeat(3,1fr);height:auto;min-height:var(--tabs);padding:4px 6px;gap:4px}.main-tabs button{font-size:11px;padding:5px 3px}.workspace{padding:6px}.results-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.method-pane{display:block}.category-tabs,.method-grid{display:none}.mobile-method{display:block}.detail-body{grid-template-columns:1fr 1fr}.relations-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.relation-summary{grid-template-columns:1fr 1fr;grid-template-rows:auto}.relation-summary .box:last-child{display:none}.compare-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.compare-head #swapCompare{display:none}.compare-head #autoCompare{display:block}.repeat-controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.repeat-controls input{display:none}.forms-grid{grid-template-columns:1fr 1fr}.form-card:last-child{grid-column:1/-1}.kvgrid,.analysis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bigvalue{font-size:34px}\n}"
          new="@media(max-width:820px){\n  :root{--top:0px;--tabs:46px}\n  .topbar{min-height:0;grid-template-columns:1fr auto;grid-template-rows:auto;padding:7px 8px 6px;gap:6px}\n  .brand{display:none}.querybox{grid-column:1/2;grid-row:1}.top-actions{grid-column:2/3;grid-row:1}.queryside{min-width:100px}\n  .main-tabs{grid-template-columns:repeat(3,1fr);height:auto;min-height:var(--tabs);padding:4px 6px;gap:4px}\n  .main-tabs button{font-size:11px;padding:5px 3px}\n  .workspace{padding:6px}.results-layout{grid-template-columns:1fr;grid-template-rows:auto auto}\n  .method-pane{display:grid}.category-tabs,.method-grid{display:grid}.mobile-method{display:none}\n  .detail-body{grid-template-columns:1fr 1fr}.relations-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.relation-summary{grid-template-columns:1fr 1fr;grid-template-rows:auto}.relation-summary .box:last-child{display:none}.compare-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.compare-head #swapCompare{display:none}.compare-head #autoCompare{display:block}.repeat-controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.repeat-controls input{display:none}.forms-grid{grid-template-columns:1fr 1fr}.form-card:last-child{grid-column:1/-1}.kvgrid,.analysis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bigvalue{font-size:34px}\n}"
          assert old in s, "missing anchor: mobile topbar gap"
          s=s.replace(old,new,1)
          old="function defaultBaseKeys(script){const preferred=script==='he'?['regular','ordinal','reduced']:script==='el'?['isopsephy','ordinal']:['ordinal','regular','pythagorean'];const valid=new Set(current.results.map(r=>r.method.key));return preferred.filter(k=>valid.has(k))}"
          new="function defaultBaseKeys(script){const preferred=script==='he'?['regular','reduced','ordinal']:script==='el'?['isopsephy','ordinal']:['ordinal','pythagorean','regular'];const valid=new Set(current.results.map(r=>r.method.key));return preferred.filter(k=>valid.has(k))}"
          assert old in s, "missing anchor: default order"
          s=s.replace(old,new,1)
          old="document.getElementById('methodGrid').addEventListener('click',e=>{const b=e.target.closest('[data-method]');if(!b)return;const key=b.dataset.method;if(!state.selectionTouched){state.selectedMethods=[key];state.selectionTouched=true;state.methodKey=key}else{const i=state.selectedMethods.indexOf(key);if(i>=0&&state.selectedMethods.length>1){state.selectedMethods.splice(i,1);state.methodKey=state.selectedMethods[state.selectedMethods.length-1]}else if(i<0){state.selectedMethods.push(key);state.methodKey=key}else state.methodKey=key}state.word=0;renderResults();if(state.compareAuto){refreshAutoCompareTarget();renderCompare()}});"
          new="document.getElementById('methodGrid').addEventListener('click',e=>{const b=e.target.closest('[data-method]');if(!b)return;const key=b.dataset.method;if(!state.selectionTouched)state.selectionTouched=true;const i=state.selectedMethods.indexOf(key);if(i>=0&&state.selectedMethods.length>1){state.selectedMethods.splice(i,1);state.methodKey=state.selectedMethods[state.selectedMethods.length-1]}else if(i<0){state.selectedMethods.push(key);state.methodKey=key}else state.methodKey=key;state.word=0;renderResults();if(state.compareAuto){refreshAutoCompareTarget();renderCompare()}});"
          assert old in s, "missing anchor: preserve defaults when adding"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile spacing and let comparison stage grow with selections"
          git push origin main
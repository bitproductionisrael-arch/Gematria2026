name: One-time Compact Math Perati Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make math readable, enforce Perati squares, and prevent overlaps
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="<meta name=\"theme-color\" content=\"#0d1117\">"
          new="<meta name=\"theme-color\" content=\"#0d1117\">\n<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n<meta http-equiv=\"Pragma\" content=\"no-cache\">\n<meta http-equiv=\"Expires\" content=\"0\">"
          assert old in s, "missing anchor: cache headers"
          s=s.replace(old,new,1)
          old=".multi-detail-card .mh{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px}.multi-detail-card .mn{font-size:14px;font-weight:850;line-height:1.35;min-width:0}.multi-detail-card .mv{font-size:clamp(38px,3vw,54px);font-weight:950;line-height:.95;direction:ltr;color:var(--blue);text-shadow:0 0 24px rgba(99,169,255,.14)}"
          new=".multi-detail-card .mh{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(86px,max-content);align-items:start;gap:8px;overflow:hidden}.multi-detail-card .mn{font-size:14px;font-weight:850;line-height:1.25;min-width:0;max-width:100%;white-space:normal;word-break:normal;overflow-wrap:normal;overflow:hidden}.multi-detail-card .mv{font-size:clamp(34px,3vw,50px);font-weight:950;line-height:.95;direction:ltr;color:var(--blue);text-shadow:0 0 24px rgba(99,169,255,.14);white-space:nowrap;min-width:0;max-width:150px;overflow:hidden;text-overflow:ellipsis}"
          assert old in s, "missing anchor: hard header boundaries"
          s=s.replace(old,new,1)
          old=".fact-line.corpus-line{color:#bdf4f0}\n.fact-sep{color:#586777;padding:0 3px}"
          new=".fact-line.corpus-line{color:#bdf4f0}\n.fact-sep{color:#586777;padding:0 3px}\n.math-chip-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}\n.math-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #344353;border-radius:999px;padding:3px 7px;font-size:11px;line-height:1.15;white-space:nowrap;background:#0b1219;color:#d8e2ec}\n.math-chip.anchor{border-color:#6f5a2d;color:#ffe2a0}\n.math-chip.shape{border-color:#57467d;color:#dfd0ff}\n.perati-word-title{font-size:17px;letter-spacing:.02em}\n.perati-chip b{font-size:24px}.perati-chip small{font-size:11px;color:#ffe2a0}"
          assert old in s, "missing anchor: math chips css"
          s=s.replace(old,new,1)
          old="  .multi-detail-card .mh{\n    grid-template-columns:auto minmax(0,1fr) auto;\n    gap:6px;\n    align-items:center;\n  }\n  .multi-detail-card .mv{\n    font-size:clamp(28px,8vw,38px);\n    white-space:nowrap;\n  }"
          new="  .multi-detail-card .mh{\n    grid-template-columns:auto minmax(0,1fr);\n    grid-template-areas:\"actions value\" \"title title\";\n    gap:4px 7px;\n    align-items:center;\n    overflow:hidden;\n  }\n  .multi-detail-card .card-actions{grid-area:actions}\n  .multi-detail-card .mv{grid-area:value;justify-self:end;font-size:clamp(28px,8vw,38px);white-space:nowrap;max-width:100%}\n  .multi-detail-card .mn{grid-area:title;justify-self:stretch;white-space:normal;overflow:hidden;line-height:1.15;padding-top:2px}\n"
          assert old in s, "missing anchor: mobile header no overlap"
          s=s.replace(old,new,1)
          old=" if(r.method.key==='perati'){\n  const chips=w.toks.map((t,i)=>{const base=peratiBaseValue(t);return `<span class=\"letter-chip\"><b>${esc(t.label)}²</b><small>${fmt(base)}²</small><strong>${fmt(w.baseVals[i])}</strong></span>`}).join('');\n  return `<div class=\"word-block\"><div class=\"word-title\">${esc(squaredWordLabel(w))}</div><div class=\"letter-grid\">${chips}</div><div class=\"word-total\"><span>סכום</span><b>${fmt(sum(w.baseVals))}</b></div></div>`\n }"
          new=" if(r.method.key==='perati'){\n  const chips=w.toks.map((t,i)=>{const base=peratiBaseValue(t);return `<span class=\"letter-chip perati-chip\"><b>${esc(t.label)}²</b><small>(${fmt(base)}²)</small><strong>${fmt(w.baseVals[i])}</strong></span>`}).join('');\n  return `<div class=\"word-block\"><div class=\"word-title perati-word-title\">${esc(squaredWordLabel(w))}</div><div class=\"letter-grid\">${chips}</div><div class=\"word-total\"><span>סכום</span><b>${fmt(sum(w.baseVals))}</b></div></div>`\n }"
          assert old in s, "missing anchor: perati visual emphasis"
          s=s.replace(old,new,1)
          old="function interestingMultipleDetails(n,limit=8){\n const anchorSet=new Set(CARD_ANCHORS),seen=new Set(),rows=[];\n for(const a of CARD_ANCHORS){\n  if(n<=a||n%a!==0)continue;\n  const q=n/a,lo=Math.min(a,q),hi=Math.max(a,q),key=lo+'x'+hi;\n  if(seen.has(key))continue;seen.add(key);\n  const loForms=shapes(lo).slice(0,1),hiForms=shapes(hi).slice(0,1);\n  const loHit=shortCorpusLabel(lo),hiHit=shortCorpusLabel(hi);\n  let score=0;\n  if(anchorSet.has(lo))score+=18;if(anchorSet.has(hi))score+=18;\n  if(loForms.length)score+=14;if(hiForms.length)score+=14;\n  if(loHit)score+=18;if(hiHit)score+=18;\n  if(lo===24||hi===24||lo===37||hi===37||lo===136||hi===136||lo===222||hi===222)score+=24;\n  let notes=[];\n  if(loHit)notes.push(fmt(lo)+'='+loHit);else if(loForms.length)notes.push(fmt(lo)+'='+loForms[0]);\n  if(hiHit)notes.push(fmt(hi)+'='+hiHit);else if(hiForms.length)notes.push(fmt(hi)+'='+hiForms[0]);\n  rows.push({text:`${fmt(lo)}×${fmt(hi)}${notes.length?' ('+notes.join(' · ')+')':''}`,score});\n }\n return rows.sort((x,y)=>y.score-x.score||x.text.length-y.text.length).slice(0,limit).map(x=>x.text)\n}\nfunction anchorDecompositions(n){return interestingMultipleDetails(n,8)}\n"
          new="function interestingFactorPairs(n,limit=6){\n const anchorSet=new Set(CARD_ANCHORS),seen=new Set(),rows=[];\n for(const a of CARD_ANCHORS){\n  if(n<=a||n%a!==0)continue;\n  const q=n/a,lo=Math.min(a,q),hi=Math.max(a,q),key=lo+'x'+hi;\n  if(seen.has(key))continue;seen.add(key);\n  const loForms=shapes(lo).slice(0,1),hiForms=shapes(hi).slice(0,1);\n  const loHit=shortCorpusLabel(lo),hiHit=shortCorpusLabel(hi);\n  let score=0;\n  if(anchorSet.has(lo))score+=18;if(anchorSet.has(hi))score+=18;\n  if(loForms.length)score+=14;if(hiForms.length)score+=14;\n  if(loHit)score+=18;if(hiHit)score+=18;\n  if([24,37,136,222].includes(lo)||[24,37,136,222].includes(hi))score+=24;\n  rows.push({lo,hi,loForms,hiForms,loHit,hiHit,score,text:`${fmt(lo)}×${fmt(hi)}`});\n }\n return rows.sort((x,y)=>y.score-x.score||x.text.length-y.text.length).slice(0,limit)\n}\nfunction interestingMultipleDetails(n,limit=6){return interestingFactorPairs(n,limit).map(x=>x.text)}\nfunction shapeIcon(s){\n if(/²$/.test(s))return'□';\n if(/³$/.test(s))return'◼';\n if(/^T\\d+/.test(s))return'▲';\n if(/^P\\d+/.test(s))return'⬟';\n if(/^H\\d+/.test(s))return'⬢';\n if(/^Star/.test(s))return'★';\n if(/^Tet/.test(s))return'◆';\n if(/^F\\d+/.test(s))return'F';\n if(/^L\\d+/.test(s))return'L';\n if(/^C\\d+/.test(s))return'◎';\n return'◇'\n}\nfunction interestingFactorShapes(n,limit=6){\n const out=[],seen=new Set();\n for(const p of interestingFactorPairs(n,8)){\n  for(const [v,forms] of [[p.lo,p.loForms],[p.hi,p.hiForms]]){\n   for(const s of forms){\n    const key=v+'='+s;if(seen.has(key))continue;seen.add(key);\n    out.push({icon:shapeIcon(s),text:`${fmt(v)}=${s}`});\n    if(out.length>=limit)return out\n   }\n  }\n }\n return out\n}\nfunction anchorDecompositions(n){return interestingMultipleDetails(n,6)}\n"
          assert old in s, "missing anchor: compact factor pairs and shape icons"
          s=s.replace(old,new,1)
          old=" const anchors=anchorDecompositions(n);\n const forms=(a.forms||[]).concat(a.binom||[]).slice(0,4);\n const hits=corpusHits(n);\n const props=[a.aliquot,a.squarefree?'Squarefree':'',a.powerful?'Powerful':'',`DR=${a.root}`].filter(Boolean);\n let html=`<div class=\"compact-facts\"><div class=\"fact-line\">${core.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(props.length)html+=`<div class=\"fact-line\"><b>תכונות:</b> ${props.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(anchors.length)html+=`<div class=\"fact-line anchor-line\"><b>כפולות מעניינות:</b> ${anchors.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(forms.length)html+=`<div class=\"fact-line\"><b>צורות / כוחות:</b> ${forms.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(hits.length)html+=`<div class=\"fact-line corpus-line\"><b>קורפוס:</b> ${hits.map(h=>esc(h.label)).join(' / ')}</div>`;"
          new=" const anchors=interestingMultipleDetails(n,4);\n const factorShapes=interestingFactorShapes(n,5);\n const directForms=(a.forms||[]).concat(a.binom||[]).slice(0,3).map(s=>({icon:shapeIcon(s),text:s}));\n const formMap=new Map();[...directForms,...factorShapes].forEach(x=>formMap.set(x.icon+'|'+x.text,x));\n const formChips=[...formMap.values()].slice(0,6);\n const hits=corpusHits(n);\n const props=[a.aliquot,`DR=${a.root}`].filter(Boolean);\n let html=`<div class=\"compact-facts\"><div class=\"fact-line\">${core.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(props.length)html+=`<div class=\"fact-line\"><b>תכונות:</b> ${props.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(anchors.length)html+=`<div class=\"math-chip-row\">${anchors.map(x=>`<span class=\"math-chip anchor\">✦ ${esc(x)}</span>`).join('')}</div>`;\n if(formChips.length)html+=`<div class=\"math-chip-row\">${formChips.map(x=>`<span class=\"math-chip shape\">${esc(x.icon)} ${esc(x.text)}</span>`).join('')}</div>`;\n if(hits.length)html+=`<div class=\"fact-line corpus-line\"><b>קורפוס:</b> ${hits.map(h=>esc(h.label)).join(' / ')}</div>`;"
          assert old in s, "missing anchor: readable card math"
          s=s.replace(old,new,1)
          old="function richMagnetText(r){\n const base=minimalResultText(r),a=analyzeNumber(r.total);if(!a)return base;\n const lines=[base];\n const idx=a.prime?`Prime #${a.primeIndex}`:(a.compositeIndex?`Composite #${a.compositeIndex}`:'');\n lines.push([`פירוק: ${fmtFactors(a.factors)}`,idx,`φ=${fmt(a.phi)}`,`τ=${fmt(a.tau)}`,`σ=${fmt(a.sigma)}`,`rad=${fmt(a.rad)}`,`DR=${a.root}`].filter(Boolean).join(' · '));\n const mult=interestingMultipleDetails(r.total,10);if(mult.length)lines.push('כפולות מעניינות: '+mult.join(' · '));\n const forms=(a.forms||[]).concat(a.binom||[]);if(forms.length)lines.push('צורות / כוחות: '+forms.join(' · '));\n const hits=corpusHits(r.total);if(hits.length)lines.push('קורפוס: '+hits.map(h=>h.label).join(' / '));\n return lines.join('\\n')\n}"
          new="function richMagnetText(r){\n const base=minimalResultText(r),a=analyzeNumber(r.total);if(!a)return base;\n const lines=[base];\n const idx=a.prime?`Prime #${a.primeIndex}`:(a.compositeIndex?`Composite #${a.compositeIndex}`:'');\n lines.push('🔢 '+[`${fmtFactors(a.factors)}`,idx,`φ=${fmt(a.phi)}`,`τ=${fmt(a.tau)}`,`σ=${fmt(a.sigma)}`,`rad=${fmt(a.rad)}`,`DR=${a.root}`].filter(Boolean).join(' · '));\n const mult=interestingMultipleDetails(r.total,4);if(mult.length)lines.push('✦ '+mult.join(' · '));\n const direct=(a.forms||[]).concat(a.binom||[]).slice(0,3).map(s=>({icon:shapeIcon(s),text:s}));\n const forms=[...direct,...interestingFactorShapes(r.total,5)];const seen=new Set(),compact=[];\n for(const x of forms){const k=x.icon+'|'+x.text;if(seen.has(k))continue;seen.add(k);compact.push(x);if(compact.length>=6)break}\n if(compact.length)lines.push(compact.map(x=>x.icon+' '+x.text).join(' · '));\n const hits=corpusHits(r.total);if(hits.length)lines.push('◎ '+hits.map(h=>h.label).join(' / '));\n return lines.join('\\n')\n}"
          assert old in s, "missing anchor: readable math magnet"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Compact math facts, emphasize Perati squares, prevent card overlap"
          git push origin main
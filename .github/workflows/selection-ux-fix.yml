name: One-time Selection UX Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix first-click selection behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          new="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],selectionTouched:false,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          assert old in s
          s=s.replace(old,new,1)
          old="document.getElementById('methodGrid').addEventListener('click',e=>{const b=e.target.closest('[data-method]');if(!b)return;const key=b.dataset.method;const i=state.selectedMethods.indexOf(key);if(i>=0&&state.selectedMethods.length>1){state.selectedMethods.splice(i,1);state.methodKey=state.selectedMethods[state.selectedMethods.length-1]}else if(i<0){state.selectedMethods.push(key);state.methodKey=key}else state.methodKey=key;state.word=0;renderResults();if(state.compareAuto){refreshAutoCompareTarget();renderCompare()}});"
          new="document.getElementById('methodGrid').addEventListener('click',e=>{const b=e.target.closest('[data-method]');if(!b)return;const key=b.dataset.method;if(!state.selectionTouched){state.selectedMethods=[key];state.selectionTouched=true;state.methodKey=key}else{const i=state.selectedMethods.indexOf(key);if(i>=0&&state.selectedMethods.length>1){state.selectedMethods.splice(i,1);state.methodKey=state.selectedMethods[state.selectedMethods.length-1]}else if(i<0){state.selectedMethods.push(key);state.methodKey=key}else state.methodKey=key}state.word=0;renderResults();if(state.compareAuto){refreshAutoCompareTarget();renderCompare()}});"
          assert old in s
          s=s.replace(old,new,1)
          old="document.getElementById('mobileMethod').addEventListener('change',e=>{state.methodKey=e.target.value;state.selectedMethods=[e.target.value];state.word=0;"
          new="document.getElementById('mobileMethod').addEventListener('change',e=>{state.methodKey=e.target.value;state.selectedMethods=[e.target.value];state.selectionTouched=true;state.word=0;"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make first method click replace default selection"
          git push origin main
name: One-time Minimal Magnet Copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add per-selection minimal magnet copy
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=".multi-detail-card .mh{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px}.multi-detail-card .mn{font-size:14px;font-weight:850;line-height:1.35;min-width:0}.multi-detail-card .mv{font-size:clamp(38px,3vw,54px);font-weight:950;line-height:.95;direction:ltr;color:var(--blue);text-shadow:0 0 24px rgba(99,169,255,.14)}\n.multi-detail-card .remove-method{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:10px;z-index:2}"
          new=".multi-detail-card .mh{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px}.multi-detail-card .mn{font-size:14px;font-weight:850;line-height:1.35;min-width:0}.multi-detail-card .mv{font-size:clamp(38px,3vw,54px);font-weight:950;line-height:.95;direction:ltr;color:var(--blue);text-shadow:0 0 24px rgba(99,169,255,.14)}\n.multi-detail-card .card-actions{display:flex;gap:5px;align-items:center;z-index:2}\n.multi-detail-card .remove-method,.multi-detail-card .copy-method{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:10px;z-index:2}\n.multi-detail-card .copy-method{border-color:#326c69;color:#bdf4f0}"
          assert old in s, "missing anchor: card action css"
          s=s.replace(old,new,1)
          old="function renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-count\">${rows.length} בחירות</div></div>`+rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></div><div class=\"badges\">${badgesFor(r.total)}</div><div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`).join('')}"
          new="function minimalMethodName(r){return String(r?.method?.name||'').split(' / ')[0].trim()}\nfunction minimalResultText(r){const q=document.getElementById('q').value.trim();return `${q} = ${fmt(r.total)} (${minimalMethodName(r)})`}\nfunction renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-count\">${rows.length} בחירות</div></div>`+rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><div class=\"card-actions\"><button class=\"copy-method\" data-copy-method=\"${r.method.key}\" title=\"העתק רק את הבחירה\">🧲</button><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></div><div class=\"badges\">${badgesFor(r.total)}</div><div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`).join('')}"
          assert old in s, "missing anchor: minimal copy helper and per-card magnet"
          s=s.replace(old,new,1)
          old="document.getElementById('multiDetailGrid').addEventListener('click',e=>{const b=e.target.closest('[data-remove-method]');if(!b)return;const key=b.dataset.removeMethod;state.selectedMethods=state.selectedMethods.filter(k=>k!==key);if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];state.methodKey=state.selectedMethods[state.selectedMethods.length-1]||state.methodKey;renderResults()});"
          new="document.getElementById('multiDetailGrid').addEventListener('click',async e=>{const c=e.target.closest('[data-copy-method]');if(c){const r=current.results.find(x=>x.method.key===c.dataset.copyMethod);if(!r)return;const ok=await copyText(minimalResultText(r));toast(ok?'הבחירה הועתקה':'שגיאה בהעתקה');return}const b=e.target.closest('[data-remove-method]');if(!b)return;const key=b.dataset.removeMethod;state.selectedMethods=state.selectedMethods.filter(k=>k!==key);if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];state.methodKey=state.selectedMethods[state.selectedMethods.length-1]||state.methodKey;renderResults()});"
          assert old in s, "missing anchor: per-card magnet event"
          s=s.replace(old,new,1)
          old="document.getElementById('copyAll').addEventListener('click',async()=>{const el=activeExportTarget();const ok=await copyText(exportVisibleLines(el).join('\\n'));toast(ok?(state.tab==='results'&&state.selectionTouched?'הבחירה הועתקה':'הטאב הועתק כטקסט'):'שגיאה בהעתקה')});"
          new="document.getElementById('copyAll').addEventListener('click',async()=>{if(state.tab==='results'&&selectedResults().length){const ok=await copyText(selectedResults().map(minimalResultText).join('\\n'));toast(ok?'הבחירות הועתקו':'שגיאה בהעתקה');return}const el=activeExportTarget();const ok=await copyText(exportVisibleLines(el).join('\\n'));toast(ok?'הטאב הועתק כטקסט':'שגיאה בהעתקה')});"
          assert old in s, "missing anchor: top magnet selected-only"
          s=s.replace(old,new,1)
          old="console.assert(T('חכמה','he','reverseOrdinal')===55,'Hokhmah reverse ordinal 55');"
          new="console.assert(T('חכמה','he','reverseOrdinal')===55,'Hokhmah reverse ordinal 55');\nconsole.assert(T('תדר תדר תדר תדר תדר תדר תדר תדר תדר ת','he','reverseOrdinal')===208,'9 Teder + Tav reverse ordinal 208');"
          assert old in s, "missing anchor: new teder self-test"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add minimal per-selection magnet copy"
          git push origin main
name: One-time Moshe 456 Closure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Moshe 456 composite closure
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="[358,'משיח','Hebrew Regular'],[361,'הנוצרי','Hebrew Regular'],[368,'משיחי','Hebrew Regular'],[384,'משיח יהוה','Hebrew Regular'],"
          new="[358,'משיח','Hebrew Regular'],[361,'הנוצרי','Hebrew Regular'],[368,'מייק רוב / משיחי','Hebrew Regular'],[384,'משיח יהוה','Hebrew Regular'],"
          assert old in s, "missing anchor: add Mike Rov to 368"
          s=s.replace(old,new,1)
          old="[441,'אמת / אהיה²','Hebrew Regular / Number'],[518,'מייק משיח / דוד×יחידה','Hebrew Regular / Number'],"
          new="[441,'אמת / אהיה²','Hebrew Regular / Number'],[456,'משה','Milui Mayim · Composite #368'],[518,'מייק משיח / דוד×יחידה','Hebrew Regular / Number'],"
          assert old in s, "missing anchor: add 456 Moshe Mayim corpus"
          s=s.replace(old,new,1)
          old="console.assert(calculateMilui('עמית','mayim',1,'miluiMayim').total===656,'Milui Mayim Amit 656');"
          new="console.assert(calculateMilui('עמית','mayim',1,'miluiMayim').total===656,'Milui Mayim Amit 656');\nconsole.assert(calculateMilui('משה','mayim',1,'miluiMayim').total===456,'Milui Mayim Moshe 456');\nconsole.assert(compositeIndex(456)===368,'456 composite #368');\nconsole.assert(T('מייק רוב','he','regular')===368,'Mike Rov regular 368');"
          assert old in s, "missing anchor: 456 closure self tests"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Moshe 456 composite Mike Rov closure"
          git push origin main
name: One-time Building Textual Prefixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render building methods with textual prefixes
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="function ratzoAnnotatedTerms(w){\n const terms=ratzoTextTerms(w);\n return terms.map((term,i)=>`${term}(${fmt(w.vals[i])})`)\n}"
          new="function ratzoAnnotatedTerms(w){\n const terms=ratzoTextTerms(w);\n return terms.map((term,i)=>`${term}(${fmt(w.vals[i])})`)\n}\nfunction buildingTextTerms(w){\n const letters=w.toks.map(t=>t.label),prefix=[];\n for(let i=0;i<letters.length;i++)prefix.push(letters.slice(0,i+1).join(''));\n return prefix\n}\nfunction buildingAnnotatedTerms(w){\n const terms=buildingTextTerms(w);\n return terms.map((term,i)=>`${term}(${fmt(w.vals[i])})`)\n}\nfunction isBuildingMethod(m){return !!m&&m.transform===cumulative}"
          assert old in s, "missing anchor: add building textual helpers"
          s=s.replace(old,new,1)
          old="if(m.ratzo||m.key==='ratzo')out+=`\\nרצוא ושוב: ${ratzoAnnotatedTerms(w).join(' + ')}\\n= ${sum(w.vals)}`;else if(m.transform)out+=`\\n${m.transformName}: [${w.vals.join(', ')}]\\n= ${sum(w.vals)}`;"
          new="if(m.ratzo||m.key==='ratzo')out+=`\\nרצוא ושוב: ${ratzoAnnotatedTerms(w).join(' + ')}\\n= ${sum(w.vals)}`;else if(isBuildingMethod(m))out+=`\\nבניין / Building: ${buildingAnnotatedTerms(w).join(' + ')}\\n= ${sum(w.vals)}`;else if(m.transform)out+=`\\n${m.transformName}: [${w.vals.join(', ')}]\\n= ${sum(w.vals)}`;"
          assert old in s, "missing anchor: wordDescription building textual path"
          s=s.replace(old,new,1)
          old="if(m.ratzo||m.key==='ratzo'){const rt=ratzoTextTerms(w);note=`<div class=\"transform-note\"><b>רצוא ושוב:</b><div style=\"font-size:16px;font-weight:850;margin:5px 0;direction:ltr;text-align:left\">${rt.map(esc).join(' → ')}</div><div>${ratzoAnnotatedTerms(w).map(esc).join(' + ')} = <b>${fmt(sum(w.vals))}</b></div></div>`}else if(m.transform)note=`<div class=\"transform-note\">${esc(m.transformName)} · <b>${esc(w.vals.join(' + '))}</b> = <b>${fmt(sum(w.vals))}</b></div>`;"
          new="if(m.ratzo||m.key==='ratzo'){const rt=ratzoTextTerms(w);note=`<div class=\"transform-note\"><b>רצוא ושוב:</b><div style=\"font-size:16px;font-weight:850;margin:5px 0;direction:ltr;text-align:left\">${rt.map(esc).join(' → ')}</div><div>${ratzoAnnotatedTerms(w).map(esc).join(' + ')} = <b>${fmt(sum(w.vals))}</b></div></div>`}else if(isBuildingMethod(m)){const bt=buildingTextTerms(w);note=`<div class=\"transform-note\"><b>בניין / Building:</b><div style=\"font-size:16px;font-weight:850;margin:5px 0;direction:ltr;text-align:left\">${bt.map(esc).join(' → ')}</div><div>${buildingAnnotatedTerms(w).map(esc).join(' + ')} = <b>${fmt(sum(w.vals))}</b></div></div>`}else if(m.transform)note=`<div class=\"transform-note\">${esc(m.transformName)} · <b>${esc(w.vals.join(' + '))}</b> = <b>${fmt(sum(w.vals))}</b></div>`;"
          assert old in s, "missing anchor: wordBreakdown building textual path"
          s=s.replace(old,new,1)
          old=" if(m.ratzo||m.key==='ratzo'){\n  return ratzoAnnotatedTerms(w).join(' + ')+' = '+fmt(sum(w.vals))\n }\n if(m.transform){"
          new=" if(m.ratzo||m.key==='ratzo'){\n  return ratzoAnnotatedTerms(w).join(' + ')+' = '+fmt(sum(w.vals))\n }\n if(isBuildingMethod(m)){\n  return buildingAnnotatedTerms(w).join(' + ')+' = '+fmt(sum(w.vals))\n }\n if(m.transform){"
          assert old in s, "missing anchor: magnet building textual path"
          s=s.replace(old,new,1)
          old=" if(r.method.key==='ratzo')posterText(ctx,'רצוא ושוב: '+ratzoAnnotatedTerms(w).join(' + ')+' = '+sum(w.vals),x+18,totalY+1,10,'500','#9fb0c2','left','rtl',width-132);\n else if(r.method.transform)posterText(ctx,r.method.transformName+': '+w.vals.join(' + ')+' = '+sum(w.vals),x+18,totalY+1,10,'500','#9fb0c2','left','ltr',width-132);"
          new=" if(r.method.ratzo||r.method.key==='ratzo')posterText(ctx,'רצוא ושוב: '+ratzoAnnotatedTerms(w).join(' + ')+' = '+sum(w.vals),x+18,totalY+1,10,'500','#9fb0c2','left','rtl',width-132);\n else if(isBuildingMethod(r.method))posterText(ctx,'Building: '+buildingAnnotatedTerms(w).join(' + ')+' = '+sum(w.vals),x+18,totalY+1,10,'500','#9fb0c2','left','ltr',width-132);\n else if(r.method.transform)posterText(ctx,r.method.transformName+': '+w.vals.join(' + ')+' = '+sum(w.vals),x+18,totalY+1,10,'500','#9fb0c2','left','ltr',width-132);"
          assert old in s, "missing anchor: poster building textual path"
          s=s.replace(old,new,1)
          old="console.assert(T('מייק רוב','he','regular')===368,'Mike Rov regular 368');"
          new="console.assert(T('מייק רוב','he','regular')===368,'Mike Rov regular 368');\nconst _malBuilding=calculate('Malchisedec','en',METHODS.en.find(m=>m.key==='building'));\nconsole.assert(_malBuilding.total===535,'Malchisedec English Building 535');\nconsole.assert(_malBuilding.words[0].vals.join(',')==='13,14,26,29,37,46,65,70,74,79,82','Malchisedec Building prefix sums');"
          assert old in s, "missing anchor: Malchisedec building self test"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show textual prefixes for Building methods"
          git push origin main
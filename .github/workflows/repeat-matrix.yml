name: One-time Repeat Matrix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add full repeat matrix and x2 degree control
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=".repeat-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 90px;gap:7px;min-width:0}"
          new=".repeat-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 90px auto auto;gap:7px;min-width:0}"
          assert old in s, "missing anchor: repeat controls columns"
          s=s.replace(old,new,1)
          old=".repeat-cell.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,173,85,.2),0 0 18px rgba(216,173,85,.08)}\n.repeat-add{position:absolute;left:6px;top:5px;font-size:13px;color:#8e9aa8;line-height:1}"
          new=".repeat-cell.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,173,85,.2),0 0 18px rgba(216,173,85,.08)}\n#repeatMatrixToggle.active{border-color:var(--gold);color:#ffe2a0;box-shadow:0 0 0 1px rgba(216,173,85,.18)}\n#repeatMatrixDouble{font-weight:900;font-size:16px;min-width:54px}\n.repeat-grid.matrix-mode{display:block;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#080d12;padding:0}\n.repeat-matrix{border-collapse:separate;border-spacing:0;min-width:max-content;width:max-content;direction:rtl;font-size:11px}\n.repeat-matrix th,.repeat-matrix td{border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 9px;min-width:96px;height:48px;background:#0b121a;text-align:center;vertical-align:middle}\n.repeat-matrix thead th{position:sticky;top:0;z-index:4;background:#121b25;color:#ffe2a0;font-weight:900}\n.repeat-matrix .repeat-matrix-corner{position:sticky;right:0;z-index:6;min-width:190px;text-align:right;padding-inline:12px;background:#121b25}\n.repeat-matrix .repeat-matrix-method{position:sticky;right:0;z-index:3;min-width:190px;max-width:240px;text-align:right;padding-inline:12px;background:#0f1822;color:#dce6f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.repeat-matrix-cell{cursor:pointer;transition:.12s}\n.repeat-matrix-cell:hover{background:#142131}\n.repeat-matrix-cell.selected{background:#2a2417;box-shadow:inset 0 0 0 1px var(--gold)}\n.repeat-matrix-cell b{display:block;font-size:14px;direction:ltr;color:#f2f6fa;white-space:nowrap}\n.repeat-matrix-cell span{display:block;margin-top:2px;font-size:9px;color:var(--gold);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.repeat-add{position:absolute;left:6px;top:5px;font-size:13px;color:#8e9aa8;line-height:1}"
          assert old in s, "missing anchor: matrix css"
          s=s.replace(old,new,1)
          old="      <div class=\"repeat-controls\"><input id=\"repeatPhrase\" aria-label=\"ביטוי לחזרה\"><select id=\"repeatMethod\"></select><select id=\"repeatMax\" aria-label=\"מספר חזרות\"><option>8</option><option selected>12</option><option>16</option><option>24</option></select></div>"
          new="      <div class=\"repeat-controls\"><input id=\"repeatPhrase\" aria-label=\"ביטוי לחזרה\"><select id=\"repeatMethod\"></select><select id=\"repeatMax\" aria-label=\"מספר חזרות\"><option>8</option><option selected>12</option><option>16</option><option>24</option></select><button id=\"repeatMatrixToggle\" title=\"פתח מטריקס של כל שיטות הגימטריה וכל דרגות ההכפלה\">▦ מטריקס</button><button id=\"repeatMatrixDouble\" title=\"הכפל את כל דרגות המטריקס פי 2\" hidden>×2</button></div>"
          assert old in s, "missing anchor: repeat matrix controls html"
          s=s.replace(old,new,1)
          old="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],derivedSelections:[],selectionTouched:false,lastScript:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          new="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],derivedSelections:[],selectionTouched:false,lastScript:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,repeatMatrixView:false,repeatMatrixScale:1,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          assert old in s, "missing anchor: state matrix fields"
          s=s.replace(old,new,1)
          old="function renderRepeat(){const phrase=document.getElementById('repeatPhrase').value||document.getElementById('q').value;const script=detectScript(phrase);const methods=METHODS[script];const sel=document.getElementById('repeatMethod');const old=sel.value;sel.innerHTML=methods.map(m=>`<option value=\"${m.key}\" ${m.key===old?'selected':''}>${esc(m.name)}</option>`).join('');if(!sel.value)sel.value=methods[0]?.key||'';const m=methods.find(x=>x.key===sel.value)||methods[0];const max=Math.min(24,Math.max(1,Number(document.getElementById('repeatMax').value)||12));const cells=[];for(let n=1;n<=max;n++){const r=makeRepeatSelection(phrase,script,m,n),hit=corpusHits(r.total)[0],selected=state.derivedSelections.some(x=>x.selectionKey===r.selectionKey);cells.push(`<div class=\"repeat-cell ${selected?'selected':''}\" data-repeat-n=\"${n}\" data-repeat-key=\"${esc(r.selectionKey)}\" title=\"לחץ להוסיף/להסיר ממרכז ההשוואה\"><span class=\"repeat-add\">${selected?'✓':'＋'}</span><div class=\"repeat-n\">${esc(m.name)} ×${n}</div><div class=\"repeat-v\">${fmt(r.total)}</div><div class=\"repeat-hit\">${hit?esc(hit.label):''}</div></div>`)}const per=12,pages=Math.max(1,Math.ceil(max/per));state.repeatPage=Math.min(state.repeatPage,pages-1);document.getElementById('repeatGrid').innerHTML=cells.slice(state.repeatPage*per,state.repeatPage*per+per).join('');document.getElementById('repeatPage').textContent=`${state.repeatPage+1}/${pages}`;document.getElementById('repeatPrev').disabled=state.repeatPage===0;document.getElementById('repeatNext').disabled=state.repeatPage>=pages-1;document.getElementById('repeatNote').textContent=`${m.name} · ${phrase}`}"
          new="function renderRepeat(){\n const phrase=document.getElementById('repeatPhrase').value||document.getElementById('q').value;\n const script=detectScript(phrase),methods=METHODS[script];\n const sel=document.getElementById('repeatMethod'),old=sel.value;\n sel.innerHTML=methods.map(m=>`<option value=\"${m.key}\" ${m.key===old?'selected':''}>${esc(m.name)}</option>`).join('');\n if(!sel.value)sel.value=methods[0]?.key||'';\n const m=methods.find(x=>x.key===sel.value)||methods[0];\n const max=Math.min(24,Math.max(1,Number(document.getElementById('repeatMax').value)||12));\n const grid=document.getElementById('repeatGrid'),prev=document.getElementById('repeatPrev'),next=document.getElementById('repeatNext'),page=document.getElementById('repeatPage'),note=document.getElementById('repeatNote');\n const matrixBtn=document.getElementById('repeatMatrixToggle'),doubleBtn=document.getElementById('repeatMatrixDouble');\n matrixBtn.classList.toggle('active',state.repeatMatrixView);\n doubleBtn.hidden=!state.repeatMatrixView;\n doubleBtn.title=`הכפל את כל דרגות המטריקס: ×${state.repeatMatrixScale} → ×${state.repeatMatrixScale*2}`;\n sel.disabled=state.repeatMatrixView;\n grid.classList.toggle('matrix-mode',state.repeatMatrixView);\n if(state.repeatMatrixView){\n  const cols=Array.from({length:max},(_,i)=>(i+1)*state.repeatMatrixScale);\n  let html='<table class=\"repeat-matrix\"><thead><tr><th class=\"repeat-matrix-corner\">שיטה</th>'+cols.map(n=>`<th>×${n}</th>`).join('')+'</tr></thead><tbody>';\n  for(const method of methods){\n   const short=String(method.name||'').split(' / ')[0].trim();\n   html+=`<tr><th class=\"repeat-matrix-method\" title=\"${esc(method.name)}\">${esc(short)}</th>`;\n   for(const n of cols){\n    const r=makeRepeatSelection(phrase,script,method,n),hit=corpusHits(r.total)[0],selected=state.derivedSelections.some(x=>x.selectionKey===r.selectionKey);\n    html+=`<td class=\"repeat-matrix-cell ${selected?'selected':''}\" data-repeat-n=\"${n}\" data-repeat-method=\"${esc(method.key)}\" title=\"${esc(method.name)} ×${n}\"><b>${fmt(r.total)}</b><span>${hit?esc(hit.label):''}</span></td>`;\n   }\n   html+='</tr>'\n  }\n  html+='</tbody></table>';\n  grid.innerHTML=html;\n  prev.style.display='none';next.style.display='none';page.textContent='מטריקס';\n  note.textContent=`${phrase} · ${methods.length} שיטות · דרגה ×${state.repeatMatrixScale}`;\n  return\n }\n prev.style.display='';next.style.display='';\n const cells=[];\n for(let n=1;n<=max;n++){\n  const r=makeRepeatSelection(phrase,script,m,n),hit=corpusHits(r.total)[0],selected=state.derivedSelections.some(x=>x.selectionKey===r.selectionKey);\n  cells.push(`<div class=\"repeat-cell ${selected?'selected':''}\" data-repeat-n=\"${n}\" data-repeat-key=\"${esc(r.selectionKey)}\" title=\"לחץ להוסיף/להסיר ממרכז ההשוואה\"><span class=\"repeat-add\">${selected?'✓':'＋'}</span><div class=\"repeat-n\">${esc(m.name)} ×${n}</div><div class=\"repeat-v\">${fmt(r.total)}</div><div class=\"repeat-hit\">${hit?esc(hit.label):''}</div></div>`)\n }\n const per=12,pages=Math.max(1,Math.ceil(max/per));state.repeatPage=Math.min(state.repeatPage,pages-1);\n grid.innerHTML=cells.slice(state.repeatPage*per,state.repeatPage*per+per).join('');\n page.textContent=`${state.repeatPage+1}/${pages}`;prev.disabled=state.repeatPage===0;next.disabled=state.repeatPage>=pages-1;note.textContent=`${m.name} · ${phrase}`\n}"
          assert old in s, "missing anchor: renderRepeat matrix mode"
          s=s.replace(old,new,1)
          old="['repeatPhrase','repeatMethod','repeatMax'].forEach(id=>document.getElementById(id).addEventListener(id==='repeatPhrase'?'input':'change',()=>{state.repeatPage=0;renderRepeat()}));\ndocument.getElementById('repeatGrid').addEventListener('click',e=>{const cell=e.target.closest('[data-repeat-n]');if(!cell)return;const phrase=document.getElementById('repeatPhrase').value||document.getElementById('q').value,script=detectScript(phrase),methods=METHODS[script],m=methods.find(x=>x.key===document.getElementById('repeatMethod').value)||methods[0],n=Number(cell.dataset.repeatN),r=makeRepeatSelection(phrase,script,m,n),i=state.derivedSelections.findIndex(x=>x.selectionKey===r.selectionKey);if(i>=0){state.derivedSelections.splice(i,1);toast('הוסר ממרכז ההשוואה')}else{state.derivedSelections.push(r);state.selectionTouched=true;toast('נוסף להשוואה: '+m.name+' ×'+n)}renderRepeat();renderResults()});"
          new="['repeatPhrase','repeatMethod','repeatMax'].forEach(id=>document.getElementById(id).addEventListener(id==='repeatPhrase'?'input':'change',()=>{state.repeatPage=0;if(id==='repeatPhrase')state.repeatMatrixScale=1;renderRepeat()}));\ndocument.getElementById('repeatMatrixToggle').addEventListener('click',()=>{state.repeatMatrixView=!state.repeatMatrixView;state.repeatPage=0;renderRepeat()});\ndocument.getElementById('repeatMatrixDouble').addEventListener('click',()=>{state.repeatMatrixScale*=2;renderRepeat()});\ndocument.getElementById('repeatGrid').addEventListener('click',e=>{const cell=e.target.closest('[data-repeat-n]');if(!cell)return;const phrase=document.getElementById('repeatPhrase').value||document.getElementById('q').value,script=detectScript(phrase),methods=METHODS[script],methodKey=cell.dataset.repeatMethod||document.getElementById('repeatMethod').value,m=methods.find(x=>x.key===methodKey)||methods[0],n=Number(cell.dataset.repeatN),r=makeRepeatSelection(phrase,script,m,n),i=state.derivedSelections.findIndex(x=>x.selectionKey===r.selectionKey);if(i>=0){state.derivedSelections.splice(i,1);toast('הוסר ממרכז ההשוואה')}else{state.derivedSelections.push(r);state.selectionTouched=true;toast('נוסף להשוואה: '+m.name+' ×'+n)}renderRepeat();renderResults()});"
          assert old in s, "missing anchor: repeat matrix events"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add full repeat matrix with x2 degree scaling"
          git push origin main
name: One-time Interactive Relations Upgrade V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch interactive relations
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=".toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#131c26;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}"
          new=".relation-row{cursor:pointer;transition:.15s}.relation-row:hover{border-color:#5b6a7c;background:#121b25}\n.relation-modal{position:fixed;inset:0;z-index:50;background:rgba(2,6,10,.78);display:none;align-items:center;justify-content:center;padding:18px}\n.relation-modal.open{display:flex}.relation-card{width:min(1180px,96vw);height:min(760px,92vh);background:#0f151d;border:1px solid #566273;border-radius:16px;padding:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:9px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.45)}\n.relation-card-head{display:flex;align-items:center;gap:8px}.relation-card-head .grow{flex:1;min-width:0}.relation-card-title{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.relation-card-actions{display:flex;gap:6px}\n.relation-why{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.relation-detail-grid{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}.relation-side{min-width:0;min-height:0;background:#0b1118;border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto}.relation-side h3{margin:0 0 7px;font-size:13px}.relation-pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.55;direction:rtl;text-align:right}\n@media(max-width:700px){.relation-modal{padding:7px}.relation-card{width:99vw;height:95vh}.relation-detail-grid{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}\n.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#131c26;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}"
          assert old in s, "missing anchor: css"
          s=s.replace(old,new,1)
          old="  <div id=\"toast\" class=\"toast\" aria-live=\"polite\"></div>"
          new="  <div id=\"relationModal\" class=\"relation-modal\" aria-hidden=\"true\">\n    <div id=\"relationCard\" class=\"relation-card\">\n      <div class=\"relation-card-head\">\n        <div class=\"grow\"><div id=\"relationDetailTitle\" class=\"relation-card-title\"></div><div id=\"relationDetailSub\" class=\"tiny\"></div></div>\n        <div class=\"relation-card-actions\"><button id=\"copyRelation\" class=\"iconbtn\" title=\"העתק פירוט קשר\">🧲</button><button id=\"saveRelation\" class=\"iconbtn\" title=\"צלם קשר\">📸</button><button id=\"closeRelation\" class=\"iconbtn\" title=\"סגור\">✕</button></div>\n      </div>\n      <div id=\"relationDetailWhy\" class=\"relation-why\"></div>\n      <div class=\"relation-detail-grid\">\n        <div class=\"relation-side\"><h3 id=\"relationLeftTitle\"></h3><pre id=\"relationLeftBody\" class=\"relation-pre\"></pre></div>\n        <div class=\"relation-side\"><h3 id=\"relationRightTitle\"></h3><pre id=\"relationRightBody\" class=\"relation-pre\"></pre></div>\n      </div>\n    </div>\n  </div>\n  <div id=\"toast\" class=\"toast\" aria-live=\"polite\"></div>"
          assert old in s, "missing anchor: html"
          s=s.replace(old,new,1)
          old="function pairRelations(a,b,allVals){a=Math.abs(Math.trunc(a));b=Math.abs(Math.trunc(b));if(!a||!b)return[];const rel=[];if(a===b)rel.push(['שוויון',100]);if(totient(a)===b)rel.push([`φ(${a})=${b}`,96]);if(totient(b)===a)rel.push([`φ(${b})=${a}`,96]);if(a!==b&&totient(a)===totient(b))rel.push([`אותו φ = ${totient(a)}`,92]);if(primeIndex(a)===b)rel.push([`${a}=Prime #${b}`,90]);if(primeIndex(b)===a)rel.push([`${b}=Prime #${a}`,90]);if(compositeIndex(a)===b)rel.push([`${a}=Composite #${b}`,90]);if(compositeIndex(b)===a)rel.push([`${b}=Composite #${a}`,90]);if(Math.abs(a-b)===1000)rel.push(['הפרש 1000',84]);if(stripZeros(a)===b||stripZeros(b)===a)rel.push(['zero-strip',82]);if(reverseDigits(a)===b&&a!==b)rel.push(['היפוך ספרות',80]);if(a%b===0||b%a===0)rel.push([`חלוקה שלמה ×${Math.max(a,b)/Math.min(a,b)}`,72]);const g=gcd(a,b);if(g>1&&a!==b)rel.push([`gcd=${g}`,40]);const set=new Set(allVals);const s=a+b,d=Math.abs(a-b);if(set.has(s)&&s!==a&&s!==b)rel.push([`סכום→${s}`,65]);if(d&&set.has(d)&&d!==a&&d!==b)rel.push([`הפרש→${d}`,65]);return rel}"
          new="const IMPORTANT_REL_FACTORS=new Set([18,21,24,27,32,36,37,42,55,64,72,73,88,111,136,222]);\nfunction meaningfulRatio(a,b){const hi=Math.max(a,b),lo=Math.min(a,b);if(!lo||hi%lo!==0)return null;const q=hi/lo;if(q<=1)return null;if(IMPORTANT_REL_FACTORS.has(q))return `יחס ×${q} · עוגן מבני`;const fs=shapes(q).filter(x=>!/^(F|L)/.test(x));if(q>=10&&fs.length)return `יחס ×${q} · ${fs.slice(0,2).join(' / ')}`;const hit=corpusHits(q)[0];if(q>=10&&hit)return `יחס ×${q} · ${hit.label}`;return null}\nfunction structurallyInteresting(n){return !!(corpusHits(n).length||IMPORTANT_REL_FACTORS.has(n)||(n>=10&&shapes(n).length))}\nfunction pairRelations(a,b,allVals){a=Math.abs(Math.trunc(a));b=Math.abs(Math.trunc(b));if(!a||!b)return[];const rel=[];if(a===b)rel.push(['שוויון מוחלט',100]);if(totient(a)===b)rel.push([`φ(${a})=${b}`,96]);if(totient(b)===a)rel.push([`φ(${b})=${a}`,96]);if(a!==b&&totient(a)===totient(b))rel.push([`אותו φ = ${totient(a)}`,92]);if(primeIndex(a)===b)rel.push([`${a}=Prime #${b}`,90]);if(primeIndex(b)===a)rel.push([`${b}=Prime #${a}`,90]);if(compositeIndex(a)===b)rel.push([`${a}=Composite #${b}`,90]);if(compositeIndex(b)===a)rel.push([`${b}=Composite #${a}`,90]);if(reverseDigits(a)===b&&a!==b)rel.push(['היפוך ספרות מלא',88]);if(stripZeros(a)===b||stripZeros(b)===a)rel.push(['zero-strip מדויק',84]);if(Math.abs(a-b)===1000)rel.push(['הפרש מדויק 1000',82]);const ratio=meaningfulRatio(a,b);if(ratio)rel.push([ratio,78]);const set=new Set(allVals),sm=a+b,df=Math.abs(a-b);if(set.has(sm)&&sm!==a&&sm!==b&&structurallyInteresting(sm))rel.push([`סכום מבני → ${sm}`,72]);if(df&&set.has(df)&&df!==a&&df!==b&&structurallyInteresting(df))rel.push([`הפרש מבני → ${df}`,72]);return rel}"
          assert old in s, "missing anchor: pairRelations"
          s=s.replace(old,new,1)
          old="const state={tab:'results',category:'base',methodKey:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true};"
          new="const state={tab:'results',category:'base',methodKey:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          assert old in s, "missing anchor: state"
          s=s.replace(old,new,1)
          old="function renderRelations(){const H=harmony(current.results),rels=buildRelations(current.results);"
          new="function renderRelations(){const H=harmony(current.results),rels=buildRelations(current.results);state.relationRows=rels;"
          assert old in s, "missing anchor: render start"
          s=s.replace(old,new,1)
          old="return `<div class=\"relation-row\"><div><div class=\"pair\">${fmt(x.a.total)} ↔ ${fmt(x.b.total)}</div><div class=\"why\">${esc(x.rels.map(r=>r[0]).join(' · '))}</div></div><div class=\"tiny\">${esc(x.a.method.key)} ↔ ${esc(x.b.method.key)}</div></div>`"
          new="return `<div class=\"relation-row\" data-relidx=\"${state.relPage*per+i}\" title=\"לחץ לפירוט מלא\"><div><div class=\"pair\">${fmt(x.a.total)} ↔ ${fmt(x.b.total)}</div><div class=\"why\">${esc(x.rels.map(r=>r[0]).join(' · '))}</div></div><div class=\"tiny\">${esc(x.a.method.name)} ↔ ${esc(x.b.method.name)}</div></div>`"
          assert old in s, "missing anchor: relation row"
          s=s.replace(old,new,1)
          old="function refreshAutoCompareTarget(){"
          new="function relationRuleText(r){const m=r.method;if(r.milui)return 'חוק: פירוק כל אות לשם המלא שלה וסכימת האותיות.';if(m.sub)return 'חוק: החלפת כל אות לפי טבלת הצופן של השיטה, ואז סכימת הערכים.';if(m.key==='positional')return 'חוק: ערך כל אות מוכפל במיקום שלה בתוך המילה.';if(m.transformName)return `חוק: ${m.transformName} על סדר ערכי האותיות.`;if(m.fold==='word')return 'חוק: סכום כל מילה ולאחר מכן צמצום של אותה מילה.';if(m.post)return 'חוק: סכום בסיס ולאחר מכן תוספת קבועה של השיטה.';return 'חוק: סכום ערכי האותיות לפי טבלת השיטה.'}\nfunction relationFullBreakdown(r){const out=[relationRuleText(r),''];if(!r.words?.length)return out.concat(['אין פירוק אותיות זמין.']).join('\\n');for(let i=0;i<r.words.length;i++){out.push(wordDescription(r,i));if(i<r.words.length-1)out.push('')}return out.join('\\n')}\nfunction openRelationDetail(idx){const x=state.relationRows[idx];if(!x)return;state.relationOpen=x;const exact=x.a.total===x.b.total;document.getElementById('relationDetailTitle').textContent=`${x.a.method.name} ↔ ${x.b.method.name}`;document.getElementById('relationDetailSub').textContent=`${fmt(x.a.total)} ↔ ${fmt(x.b.total)}`;document.getElementById('relationDetailWhy').innerHTML=`<span class=\"badge ${exact?'green':'cyan'}\">✓ ${exact?'שוויון מאומת':'קשר מתמטי מאומת'}</span>`+x.rels.map(r=>`<span class=\"badge gold\">${esc(r[0])}</span>`).join('');document.getElementById('relationLeftTitle').textContent=`${x.a.method.name} = ${fmt(x.a.total)}`;document.getElementById('relationRightTitle').textContent=`${x.b.method.name} = ${fmt(x.b.total)}`;document.getElementById('relationLeftBody').textContent=relationFullBreakdown(x.a);document.getElementById('relationRightBody').textContent=relationFullBreakdown(x.b);const modal=document.getElementById('relationModal');modal.classList.add('open');modal.setAttribute('aria-hidden','false')}\nfunction closeRelationDetail(){const modal=document.getElementById('relationModal');modal.classList.remove('open');modal.setAttribute('aria-hidden','true');state.relationOpen=null}\nfunction relationPlainText(){const x=state.relationOpen;if(!x)return '';return [x.a.method.name+' = '+x.a.total,x.b.method.name+' = '+x.b.total,'',x.rels.map(r=>r[0]).join(' · '),'',relationFullBreakdown(x.a),'',relationFullBreakdown(x.b)].join('\\n')}\n\nfunction refreshAutoCompareTarget(){"
          assert old in s, "missing anchor: detail functions"
          s=s.replace(old,new,1)
          old="document.getElementById('relPrev').addEventListener('click',()=>{state.relPage=Math.max(0,state.relPage-1);renderRelations()});document.getElementById('relNext').addEventListener('click',()=>{state.relPage++;renderRelations()});"
          new="document.getElementById('relPrev').addEventListener('click',()=>{state.relPage=Math.max(0,state.relPage-1);renderRelations()});document.getElementById('relNext').addEventListener('click',()=>{state.relPage++;renderRelations()});document.getElementById('relationList').addEventListener('click',e=>{const row=e.target.closest('[data-relidx]');if(!row)return;openRelationDetail(Number(row.dataset.relidx))});document.getElementById('closeRelation').addEventListener('click',closeRelationDetail);document.getElementById('relationModal').addEventListener('click',e=>{if(e.target.id==='relationModal')closeRelationDetail()});document.getElementById('copyRelation').addEventListener('click',async()=>{const ok=await copyText(relationPlainText());toast(ok?'פירוט הקשר הועתק':'שגיאה בהעתקה')});document.getElementById('saveRelation').addEventListener('click',async()=>{const x=state.relationOpen;if(!x)return;const ok=await savePanelAsPng(document.getElementById('relationCard'),`relation - ${x.a.total} - ${x.b.total}`);if(ok)toast('נשמר צילום קשר מאומת')});"
          assert old in s, "missing anchor: events"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make relations clickable and tighten matching rules"
          git push origin main
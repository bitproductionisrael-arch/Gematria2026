name: One-time Multi Result Selection Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch result multi-selection
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=".detail-pane{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px}.detail-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}.detail-title{min-width:0}.detail-title .biglabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-title .tiny{margin-top:3px}.detail-actions{display:flex;gap:5px}\n.detail-body{min-height:0;display:grid;grid-template-columns:1.05fr .95fr;gap:8px}.box{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px;min-height:0;overflow:hidden}.box h3{font-size:12px;margin:0 0 6px;color:#dbe3eb}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;text-align:left;font-size:12px;line-height:1.45}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wordnav{display:flex;gap:6px;align-items:center;margin-bottom:6px}.wordnav .grow{flex:1;text-align:center;font-size:12px;color:var(--muted)}"
          new=".detail-pane{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px}.detail-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}.detail-title{min-width:0}.detail-title .biglabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-title .tiny{margin-top:3px}.detail-actions{display:flex;gap:5px}\n.detail-body{min-height:0;display:grid;grid-template-columns:1.05fr .95fr;gap:8px}.box{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px;min-height:0;overflow:hidden}.box h3{font-size:12px;margin:0 0 6px;color:#dbe3eb}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;direction:rtl;text-align:right;font-size:15px;line-height:1.7}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wordnav{display:flex;gap:6px;align-items:center;margin-bottom:6px}.wordnav .grow{flex:1;text-align:center;font-size:13px;color:var(--muted)}\n.multi-detail-grid{display:none;height:100%;min-height:0;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;overflow:auto;align-content:start;padding:1px}\n.detail-pane.multi-mode{display:block;overflow:auto}.detail-pane.multi-mode>:not(.multi-detail-grid){display:none!important}.detail-pane.multi-mode .multi-detail-grid{display:grid}\n.multi-detail-card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;min-height:230px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px}\n.multi-detail-card .mh{display:flex;align-items:flex-start;gap:8px}.multi-detail-card .mn{font-size:13px;font-weight:800;line-height:1.35;flex:1;min-width:0}.multi-detail-card .mv{font-size:32px;font-weight:950;line-height:1;direction:ltr;color:var(--blue)}\n.multi-detail-card .remove-method{width:30px;height:30px;padding:0;display:grid;place-items:center;border-radius:8px}.multi-breakdown{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px;line-height:1.75;direction:rtl;text-align:right;color:#eef3f8}"
          assert old in s, "missing anchor: detail css"
          s=s.replace(old,new,1)
          old="      <div class=\"detail-pane\">\n        <div class=\"detail-head\">"
          new="      <div id=\"detailPane\" class=\"detail-pane\">\n        <div id=\"multiDetailGrid\" class=\"multi-detail-grid\"></div>\n        <div class=\"detail-head\">"
          assert old in s, "missing anchor: detail html"
          s=s.replace(old,new,1)
          old="const state={tab:'results',category:'base',methodKey:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          new="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          assert old in s, "missing anchor: state"
          s=s.replace(old,new,1)
          old="function ensureSelection(){const cats=categories();if(!cats.includes(state.category))state.category=cats[0]||'base';const inCat=current.results.filter(r=>r.method.cat===state.category);if(!current.results.some(r=>r.method.key===state.methodKey)||!inCat.some(r=>r.method.key===state.methodKey))state.methodKey=(inCat[0]||current.results[0])?.method.key||null;if(!current.results.some(r=>r.method.key===state.numKey))state.numKey=state.methodKey}"
          new="function ensureSelection(){const cats=categories();if(!cats.includes(state.category))state.category=cats[0]||'base';const inCat=current.results.filter(r=>r.method.cat===state.category);if(!current.results.some(r=>r.method.key===state.methodKey)||!inCat.some(r=>r.method.key===state.methodKey))state.methodKey=(inCat[0]||current.results[0])?.method.key||null;const valid=new Set(current.results.map(r=>r.method.key));state.selectedMethods=(state.selectedMethods||[]).filter(k=>valid.has(k));if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];if(!current.results.some(r=>r.method.key===state.numKey))state.numKey=state.methodKey}"
          assert old in s, "missing anchor: ensureSelection"
          s=s.replace(old,new,1)
          old="function wordDescription(r,idx){if(r.milui){const w=r.words[idx];if(!w)return'אין פירוק';return `${w.raw}\\n${w.parts.map(p=>`${p.letter}→${p.name}(${p.value})`).join(' + ')}\\n= ${w.subtotal}`}\n const w=r.words[idx];if(!w)return'אין פירוק';const m=r.method;const base=w.toks.map((t,i)=>{let lab=t.label;if(m.sub&&m.sub[t.base])lab+=`→${m.sub[t.base]}`;return `${lab}(${w.baseVals[i]})`}).join(' + ');let out=`${w.raw}\\n${base}\\nבסיס = ${sum(w.baseVals)}`;if(m.transform)out+=`\\n${m.transformName}: [${w.vals.join(', ')}]\\n= ${sum(w.vals)}`;if(m.fold==='word')out+=`\\nword root: ${sum(w.vals)} → ${w.folded}`;if(m.post)out+=`\\nכולל/מוספי → ${r.total}`;return out}"
          new="function wordDescription(r,idx){if(r.milui){const w=r.words[idx];if(!w)return'אין פירוק';return `${w.raw}\\n${w.parts.map(p=>`${p.letter}→${p.name}(${p.value})`).join(' + ')}\\n= ${w.subtotal}`}\n const w=r.words[idx];if(!w)return'אין פירוק';const m=r.method;const base=w.toks.map((t,i)=>{let lab=t.label;if(m.sub&&m.sub[t.base])lab+=`→${m.sub[t.base]}`;return `${lab}(${w.baseVals[i]})`}).join(' + ');let out=`${w.raw}\\n${base}`;if(m.transform)out+=`\\n${m.transformName}: [${w.vals.join(', ')}]\\n= ${sum(w.vals)}`;else if(m.fold==='word')out+=`\\n= ${sum(w.vals)} → ${w.folded}`;else out+=`\\n= ${sum(w.baseVals)}`;if(m.post)out+=`\\nכולל/מוספי → ${r.total}`;return out}"
          assert old in s, "missing anchor: wordDescription"
          s=s.replace(old,new,1)
          old="function renderResults(){ensureSelection();"
          new="function allWordsDescription(r){if(!r?.words?.length)return'אין פירוק';return r.words.map((_,i)=>wordDescription(r,i)).join('\\n\\n')}\nfunction renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');grid.innerHTML=rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"badges\">${badgesFor(r.total)}</div><pre class=\"multi-breakdown\">${esc(allWordsDescription(r))}</pre></div>`).join('')}\nfunction renderResults(){ensureSelection();"
          assert old in s, "missing anchor: multi helper"
          s=s.replace(old,new,1)
          old="document.getElementById('methodGrid').innerHTML=group.map(r=>`<button class=\"method-btn ${r.method.key===state.methodKey?'active':''}\" data-method=\"${r.method.key}\"><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></button>`).join('');"
          new="document.getElementById('methodGrid').innerHTML=group.map(r=>`<button class=\"method-btn ${state.selectedMethods.includes(r.method.key)?'active':''}\" data-method=\"${r.method.key}\"><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></button>`).join('');"
          assert old in s, "missing anchor: method active"
          s=s.replace(old,new,1)
          old=" const r=methodByKey(state.methodKey);if(!r)return;state.word=Math.min(state.word,Math.max(0,r.words.length-1));"
          new=" const selected=state.selectedMethods.map(k=>current.results.find(r=>r.method.key===k)).filter(Boolean);const pane=document.getElementById('detailPane');if(selected.length>1){renderMultiDetails(selected);return}else pane.classList.remove('multi-mode');const r=selected[0]||methodByKey(state.methodKey);if(!r)return;state.methodKey=r.method.key;state.word=Math.min(state.word,Math.max(0,r.words.length-1));"
          assert old in s, "missing anchor: render multi branch"
          s=s.replace(old,new,1)
          old="document.getElementById('methodGrid').addEventListener('click',e=>{const b=e.target.closest('[data-method]');if(!b)return;state.methodKey=b.dataset.method;state.word=0;renderResults();if(state.compareAuto){refreshAutoCompareTarget();renderCompare()}});"
          new="document.getElementById('methodGrid').addEventListener('click',e=>{const b=e.target.closest('[data-method]');if(!b)return;const key=b.dataset.method;const i=state.selectedMethods.indexOf(key);if(i>=0&&state.selectedMethods.length>1){state.selectedMethods.splice(i,1);state.methodKey=state.selectedMethods[state.selectedMethods.length-1]}else if(i<0){state.selectedMethods.push(key);state.methodKey=key}else state.methodKey=key;state.word=0;renderResults();if(state.compareAuto){refreshAutoCompareTarget();renderCompare()}});"
          assert old in s, "missing anchor: method click"
          s=s.replace(old,new,1)
          old="document.getElementById('mobileMethod').addEventListener('change',e=>{state.methodKey=e.target.value;state.word=0;const r=methodByKey(state.methodKey);if(r)state.category=r.method.cat;renderResults();if(state.compareAuto){refreshAutoCompareTarget();renderCompare()}});"
          new="document.getElementById('mobileMethod').addEventListener('change',e=>{state.methodKey=e.target.value;state.selectedMethods=[e.target.value];state.word=0;const r=methodByKey(state.methodKey);if(r)state.category=r.method.cat;renderResults();if(state.compareAuto){refreshAutoCompareTarget();renderCompare()}});"
          assert old in s, "missing anchor: mobile"
          s=s.replace(old,new,1)
          old="document.getElementById('copyOne').addEventListener('click',async()=>{"
          new="document.getElementById('multiDetailGrid').addEventListener('click',e=>{const b=e.target.closest('[data-remove-method]');if(!b)return;const key=b.dataset.removeMethod;state.selectedMethods=state.selectedMethods.filter(k=>k!==key);if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];state.methodKey=state.selectedMethods[state.selectedMethods.length-1]||state.methodKey;renderResults()});\ndocument.getElementById('copyOne').addEventListener('click',async()=>{"
          assert old in s, "missing anchor: multi remove event"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Allow multi-select result breakdowns and enlarge letter details"
          git push origin main
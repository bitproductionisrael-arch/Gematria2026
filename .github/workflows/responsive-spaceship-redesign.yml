name: One-time Responsive Spaceship Redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Redesign responsive results workspace
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=".results-layout{height:100%;display:grid;grid-template-columns:minmax(250px,34%) minmax(0,1fr);gap:10px;min-height:0}\n.method-pane,.detail-pane{min-height:0;overflow:hidden}.method-pane{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}.category-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.category-tabs button{font-size:12px;padding:7px 4px}\n.method-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(48px,1fr);gap:6px;min-height:0}.method-btn{text-align:right;padding:6px 8px;min-width:0}.method-btn .mn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.method-btn .mv{font-size:19px;font-weight:850;direction:ltr;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.method-btn.active .mv{color:#ffe2a0}\n.mobile-method{display:none;width:100%;height:40px;padding:6px}"
          new=".results-layout{height:100%;display:grid;grid-template-columns:clamp(320px,24vw,390px) minmax(0,1fr);gap:14px;min-height:0}\n.method-pane,.detail-pane{min-height:0;overflow:hidden}.method-pane{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:12px;border:1px solid #253444;border-radius:18px;background:radial-gradient(circle at 80% 0%,rgba(99,169,255,.11),transparent 32%),linear-gradient(180deg,#0d151f,#0a1017);box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 14px 40px rgba(0,0,0,.18)}\n.dock-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.dock-title b{font-size:15px}.dock-title span{font-size:10px;color:var(--muted)}\n.category-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.category-tabs button{font-size:12px;padding:9px 5px;border-radius:12px}\n.method-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(68px,auto);gap:8px;min-height:0;overflow:auto;padding-inline-end:2px;align-content:start}.method-btn{text-align:right;padding:9px 10px;min-width:0;border-radius:13px;background:#0b121a}.method-btn:hover{background:#101b27}.method-btn .mn{font-size:11px;line-height:1.25;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.method-btn .mv{font-size:24px;font-weight:900;direction:ltr;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.method-btn.active{box-shadow:0 0 0 1px rgba(216,173,85,.28),0 0 22px rgba(216,173,85,.08)}.method-btn.active .mv{color:#ffe2a0}\n.mobile-method{display:none;width:100%;height:42px;padding:6px}"
          assert old in s, "missing anchor: results layout CSS"
          s=s.replace(old,new,1)
          old=".multi-detail-grid{display:none;height:100%;min-height:0;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;overflow:auto;align-content:start;padding:1px}\n.detail-pane.multi-mode{display:block;overflow:auto}.detail-pane.multi-mode>:not(.multi-detail-grid){display:none!important}.detail-pane.multi-mode .multi-detail-grid{display:grid}\n.multi-detail-card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;min-height:230px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px}\n.multi-detail-card .mh{display:flex;align-items:flex-start;gap:8px}.multi-detail-card .mn{font-size:13px;font-weight:800;line-height:1.35;flex:1;min-width:0}.multi-detail-card .mv{font-size:32px;font-weight:950;line-height:1;direction:ltr;color:var(--blue)}\n.multi-detail-card .remove-method{width:30px;height:30px;padding:0;display:grid;place-items:center;border-radius:8px}.multi-breakdown{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px;line-height:1.75;direction:rtl;text-align:right;color:#eef3f8}"
          new=".multi-detail-grid{display:none;height:100%;min-height:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px;overflow:auto;align-content:start;padding:2px 4px 18px}\n.detail-pane.multi-mode{display:block;overflow:hidden;background:radial-gradient(circle at 20% 0%,rgba(95,211,207,.07),transparent 28%),radial-gradient(circle at 86% 8%,rgba(173,140,255,.07),transparent 30%),#0c1219;border:1px solid #25313e;border-radius:20px;padding:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.detail-pane.multi-mode>:not(.multi-detail-grid){display:none!important}.detail-pane.multi-mode .multi-detail-grid{display:grid}\n.stage-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 2px}.stage-head .stage-title{font-size:18px;font-weight:900}.stage-head .stage-sub{font-size:11px;color:var(--muted);margin-top:2px}.stage-count{font-size:11px;color:#bdf4f0;border:1px solid #326c69;border-radius:999px;padding:5px 9px;white-space:nowrap}\n.multi-detail-card{position:relative;background:linear-gradient(180deg,#101821,#0c131b);border:1px solid #314052;border-radius:18px;padding:16px;min-width:0;min-height:300px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px;box-shadow:0 16px 38px rgba(0,0,0,.17),inset 0 1px 0 rgba(255,255,255,.025)}\n.multi-detail-card:before{content:\"\";position:absolute;inset:0;border-radius:18px;pointer-events:none;background:linear-gradient(120deg,rgba(99,169,255,.045),transparent 36%,rgba(216,173,85,.03))}\n.multi-detail-card .mh{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px}.multi-detail-card .mn{font-size:14px;font-weight:850;line-height:1.35;min-width:0}.multi-detail-card .mv{font-size:clamp(38px,3vw,54px);font-weight:950;line-height:.95;direction:ltr;color:var(--blue);text-shadow:0 0 24px rgba(99,169,255,.14)}\n.multi-detail-card .remove-method{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:10px;z-index:2}.multi-breakdown{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px;line-height:1.75;direction:rtl;text-align:right;color:#eef3f8}\n.word-block{position:relative;border-top:1px solid #22303d;padding-top:10px;margin-top:2px}.word-block:first-child{border-top:0;padding-top:0}.word-title{font-size:14px;font-weight:850;margin-bottom:8px}.letter-grid{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch}.letter-chip{min-width:64px;background:#0a1118;border:1px solid #263746;border-radius:12px;padding:8px 9px;display:grid;grid-template-rows:auto auto;gap:3px;text-align:center}.letter-chip b{font-size:22px;line-height:1}.letter-chip strong{font-size:16px;direction:ltr;color:#bfe0ff}.letter-chip small{font-size:9px;color:var(--muted);line-height:1.15}.word-total{display:flex;justify-content:flex-end;gap:7px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}.word-total b{font-size:19px;color:#eef3f8;direction:ltr}.transform-note{margin-top:8px;padding:7px 9px;border-radius:10px;background:#0a1017;border:1px dashed #314052;font-size:11px;color:#aebbc8;line-height:1.45}.transform-note b{color:#eaf2fa}\n@media(max-width:1280px){.results-layout{grid-template-columns:300px minmax(0,1fr)}.multi-detail-grid{grid-template-columns:1fr}.multi-detail-card{min-height:260px}}\n@media(max-width:900px){.results-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.method-pane{max-height:280px}.category-tabs{display:grid!important}.method-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));max-height:190px;overflow:auto}.mobile-method{display:none!important}.detail-pane.multi-mode{padding:9px}.multi-detail-grid{grid-template-columns:1fr}.stage-head{position:sticky;top:0;background:#0c1219;z-index:3;padding-block:5px}}\n@media(max-width:520px){.method-grid{grid-template-columns:1fr 1fr}.method-btn .mv{font-size:20px}.multi-detail-card{padding:12px;min-height:240px}.multi-detail-card .mv{font-size:36px}.letter-chip{min-width:58px;padding:7px}.letter-chip b{font-size:20px}}"
          assert old in s, "missing anchor: multi stage CSS"
          s=s.replace(old,new,1)
          old="      <div class=\"method-pane\">\n        <div class=\"category-tabs\" id=\"categoryTabs\"></div>"
          new="      <div class=\"method-pane\">\n        <div class=\"dock-title\"><b>בחר מה להוסיף למרכז</b><span>לחיצה מוסיפה · ✕ מסיר</span></div>\n        <div class=\"category-tabs\" id=\"categoryTabs\"></div>"
          assert old in s, "missing anchor: dock title HTML"
          s=s.replace(old,new,1)
          old="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],selectionTouched:false,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          new="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],selectionTouched:false,lastScript:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          assert old in s, "missing anchor: state lastScript"
          s=s.replace(old,new,1)
          old="function ensureSelection(){const cats=categories();if(!cats.includes(state.category))state.category=cats[0]||'base';const inCat=current.results.filter(r=>r.method.cat===state.category);if(!current.results.some(r=>r.method.key===state.methodKey)||!inCat.some(r=>r.method.key===state.methodKey))state.methodKey=(inCat[0]||current.results[0])?.method.key||null;const valid=new Set(current.results.map(r=>r.method.key));state.selectedMethods=(state.selectedMethods||[]).filter(k=>valid.has(k));if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];if(!current.results.some(r=>r.method.key===state.numKey))state.numKey=state.methodKey}"
          new="function defaultBaseKeys(script){const preferred=script==='he'?['regular','ordinal','reduced']:script==='el'?['isopsephy','ordinal']:['ordinal','regular','pythagorean'];const valid=new Set(current.results.map(r=>r.method.key));return preferred.filter(k=>valid.has(k))}\nfunction ensureSelection(){const cats=categories();if(!cats.includes(state.category))state.category=cats[0]||'base';const inCat=current.results.filter(r=>r.method.cat===state.category);if(!current.results.some(r=>r.method.key===state.methodKey)||!inCat.some(r=>r.method.key===state.methodKey))state.methodKey=(inCat[0]||current.results[0])?.method.key||null;const valid=new Set(current.results.map(r=>r.method.key));state.selectedMethods=(state.selectedMethods||[]).filter(k=>valid.has(k));if(!state.selectionTouched){state.selectedMethods=defaultBaseKeys(current.script)}if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];if(!current.results.some(r=>r.method.key===state.numKey))state.numKey=state.methodKey}"
          assert old in s, "missing anchor: default base selection"
          s=s.replace(old,new,1)
          old="function allWordsDescription(r){if(!r?.words?.length)return'אין פירוק';return r.words.map((_,i)=>wordDescription(r,i)).join('\\n\\n')}\nfunction renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');grid.innerHTML=rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"badges\">${badgesFor(r.total)}</div><pre class=\"multi-breakdown\">${esc(allWordsDescription(r))}</pre></div>`).join('')}"
          new="function allWordsDescription(r){if(!r?.words?.length)return'אין פירוק';return r.words.map((_,i)=>wordDescription(r,i)).join('\\n\\n')}\nfunction wordBreakdownHtml(r,w){if(r.milui){const chips=w.parts.map(p=>`<span class=\"letter-chip\"><b>${esc(p.letter)}</b><small>${esc(p.name)}</small><strong>${fmt(p.value)}</strong></span>`).join('');return `<div class=\"word-block\"><div class=\"word-title\">${esc(w.raw)}</div><div class=\"letter-grid\">${chips}</div><div class=\"word-total\"><span>סכום</span><b>${fmt(w.subtotal)}</b></div></div>`}const m=r.method;const chips=w.toks.map((t,i)=>{const sub=m.sub&&m.sub[t.base]?`<small>${esc(t.label)}→${esc(m.sub[t.base])}</small>`:'';return `<span class=\"letter-chip\"><b>${esc(t.label)}</b>${sub}<strong>${fmt(w.baseVals[i])}</strong></span>`}).join('');let note='';if(m.transform)note=`<div class=\"transform-note\">${esc(m.transformName)} · <b>${esc(w.vals.join(' + '))}</b> = <b>${fmt(sum(w.vals))}</b></div>`;else if(m.fold==='word')note=`<div class=\"transform-note\">${fmt(sum(w.vals))} → <b>${fmt(w.folded)}</b></div>`;const subtotal=m.fold==='word'?w.folded:(m.transform?sum(w.vals):sum(w.baseVals));return `<div class=\"word-block\"><div class=\"word-title\">${esc(w.raw)}</div><div class=\"letter-grid\">${chips}</div>${note}<div class=\"word-total\"><span>סכום</span><b>${fmt(subtotal)}</b></div></div>`}\nfunction richBreakdownHtml(r){return r?.words?.length?r.words.map(w=>wordBreakdownHtml(r,w)).join(''):'<div class=\"tiny\">אין פירוק</div>'}\nfunction renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-count\">${rows.length} בחירות</div></div>`+rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></div><div class=\"badges\">${badgesFor(r.total)}</div><div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`).join('')}"
          assert old in s, "missing anchor: rich card renderer"
          s=s.replace(old,new,1)
          old=" const selected=state.selectedMethods.map(k=>current.results.find(r=>r.method.key===k)).filter(Boolean);const pane=document.getElementById('detailPane');if(selected.length>1){renderMultiDetails(selected);return}else pane.classList.remove('multi-mode');const r=selected[0]||methodByKey(state.methodKey);if(!r)return;state.methodKey=r.method.key;"
          new=" const selected=state.selectedMethods.map(k=>current.results.find(r=>r.method.key===k)).filter(Boolean);const pane=document.getElementById('detailPane');if(selected.length){renderMultiDetails(selected);return}else pane.classList.remove('multi-mode');const r=methodByKey(state.methodKey);if(!r)return;state.methodKey=r.method.key;"
          assert old in s, "missing anchor: always stage"
          s=s.replace(old,new,1)
          old="function renderAll(){const text=document.getElementById('q').value;current=calculateAll(text);const names={he:'עברית · Hebrew',el:'יוונית · Greek',en:'אנגלית · English'};"
          new="function renderAll(){const text=document.getElementById('q').value;current=calculateAll(text);if(state.lastScript&&state.lastScript!==current.script){state.selectionTouched=false;state.selectedMethods=[];state.methodKey=null;state.category='base'}state.lastScript=current.script;const names={he:'עברית · Hebrew',el:'יוונית · Greek',en:'אנגלית · English'};"
          assert old in s, "missing anchor: script reset"
          s=s.replace(old,new,1)
          old="function activeExportTarget(){\n if(state.tab==='results'){\n  const selected=state.selectedMethods.map(k=>current.results.find(r=>r.method.key===k)).filter(Boolean);\n  if(state.selectionTouched&&selected.length>1)return document.getElementById('multiDetailGrid');\n  if(state.selectionTouched&&selected.length===1)return document.getElementById('detailPane');\n }\n return activePanel();\n}"
          new="function activeExportTarget(){\n if(state.tab==='results'){\n  const selected=state.selectedMethods.map(k=>current.results.find(r=>r.method.key===k)).filter(Boolean);\n  if(selected.length)return document.getElementById('multiDetailGrid');\n }\n return activePanel();\n}"
          assert old in s, "missing anchor: export target"
          s=s.replace(old,new,1)
          old="</style>"
          new="@media(min-width:1400px){.workspace{padding:14px}.topbar{padding:12px 18px}.main-tabs{padding-inline:14px}.panel{padding:12px}.detail-pane.multi-mode{padding:18px}.multi-detail-grid{gap:16px}.multi-detail-card{min-height:330px}.letter-chip{min-width:70px}}\n</style>"
          assert old in s, "missing anchor: desktop polish"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign results workspace as responsive comparison cockpit"
          git push origin main
name: One-time No Word Break Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prevent word splitting and compact titles
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="function minimalMethodName(r){return String(r?.method?.name||'').split(' / ')[0].trim()}\nfunction minimalResultText(r){const q=document.getElementById('q').value.trim();return `${q} = ${fmt(r.total)} (${minimalMethodName(r)})`}"
          new="function compactMethodFont(name){\n const len=Array.from(String(name||'')).length;\n return len>34?9:len>26?10:len>20?11:len>14?12:14\n}\nfunction minimalMethodName(r){return String(r?.method?.name||'').split(' / ')[0].trim()}\nfunction minimalResultText(r){const q=document.getElementById('q').value.trim();return `${q} = ${fmt(r.total)} (${minimalMethodName(r)})`}"
          assert old in s, "missing anchor: compact title font helper"
          s=s.replace(old,new,1)
          old="<div class=\"mn\">${esc(r.method.name)}</div>"
          new="<div class=\"mn\" style=\"font-size:${compactMethodFont(r.method.name)}px\">${esc(r.method.name)}</div>"
          assert old in s, "missing anchor: dynamic compact title font"
          s=s.replace(old,new,1)
          anchor="</style>"
          css="\n/* Never split ordinary words in comparison cards.\n   Compact the type first; only truly long uninterrupted tokens may break. */\n.multi-detail-card .mn,\n.compact-facts,\n.fact-line,\n.badge,\n.word-title,\n.transform-note,\n.multi-breakdown{\n  hyphens:none;\n  word-break:normal;\n  overflow-wrap:normal;\n}\n.multi-detail-card .mn{\n  white-space:nowrap;\n  line-height:1.12;\n  min-width:0;\n  overflow:visible;\n}\n.fact-line,.transform-note,.multi-breakdown{\n  white-space:normal;\n}\n.badge,.word-title{\n  white-space:nowrap;\n}\n@media(max-width:520px){\n  .multi-detail-card .mh{\n    grid-template-columns:auto minmax(0,1fr) auto;\n    gap:6px;\n    align-items:center;\n  }\n  .multi-detail-card .mv{\n    font-size:clamp(28px,8vw,38px);\n    white-space:nowrap;\n  }\n  .multi-detail-card .card-actions{gap:4px}\n  .multi-detail-card .remove-method,\n  .multi-detail-card .copy-method{\n    width:30px;height:30px;border-radius:9px;\n  }\n  .multi-detail-card .mn{\n    max-width:100%;\n    letter-spacing:-.01em;\n  }\n}\n/* Emergency rule: only long continuous tokens are allowed to break. */\n.long-token{overflow-wrap:anywhere;word-break:break-word}\n"
          assert anchor in s, "style close not found"
          s=s.replace(anchor,css+"\n"+anchor,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prevent word splitting and shrink comparison titles"
          git push origin main
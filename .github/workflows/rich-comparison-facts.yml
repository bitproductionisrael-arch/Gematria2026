name: One-time Rich Comparison Facts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add compact number theory and anchor facts to comparison cards
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=".multi-detail-card .copy-method{border-color:#326c69;color:#bdf4f0}"
          new=".multi-detail-card .copy-method{border-color:#326c69;color:#bdf4f0}\n.compact-facts{display:grid;gap:5px;padding:8px 10px;border:1px solid #263746;border-radius:12px;background:#0a1118}\n.fact-line{font-size:12px;line-height:1.45;color:#cbd7e3;overflow-wrap:anywhere}\n.fact-line b{color:#eef3f8}\n.fact-line.anchor-line{color:#ffe2a0}\n.fact-line.corpus-line{color:#bdf4f0}\n.fact-sep{color:#586777;padding:0 3px}\n@media(max-width:520px){.compact-facts{padding:7px 8px;gap:4px}.fact-line{font-size:11px;line-height:1.35}}"
          assert old in s, "missing anchor: compact fact css"
          s=s.replace(old,new,1)
          old="function richBreakdownHtml(r){return r?.words?.length?r.words.map(w=>wordBreakdownHtml(r,w)).join(''):'<div class=\"tiny\">אין פירוק</div>'}\nfunction minimalMethodName(r){return String(r?.method?.name||'').split(' / ')[0].trim()}"
          new="function richBreakdownHtml(r){return r?.words?.length?r.words.map(w=>wordBreakdownHtml(r,w)).join(''):'<div class=\"tiny\">אין פירוק</div>'}\nconst CARD_ANCHORS=[24,37,43,55,72,111,136,222];\nfunction anchorDecompositions(n){\n const out=[];\n for(const a of CARD_ANCHORS){if(n>a&&n%a===0)out.push(`${fmt(n/a)}×${a}`)}\n return out;\n}\nfunction compactFactsHtml(n){\n const a=analyzeNumber(n);if(!a)return'';\n const idx=a.prime?`Prime #${a.primeIndex}`:(a.compositeIndex?`Composite #${a.compositeIndex}`:'');\n const core=[idx, `פירוק: ${fmtFactors(a.factors)}`, `φ=${fmt(a.phi)}`, `τ=${fmt(a.tau)}`, `σ=${fmt(a.sigma)}`, `rad=${fmt(a.rad)}`].filter(Boolean);\n const anchors=anchorDecompositions(n);\n const forms=(a.forms||[]).concat(a.binom||[]).slice(0,4);\n const hits=corpusHits(n);\n let html=`<div class=\"compact-facts\"><div class=\"fact-line\">${core.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(anchors.length)html+=`<div class=\"fact-line anchor-line\"><b>עוגנים:</b> ${anchors.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(forms.length)html+=`<div class=\"fact-line\"><b>צורות:</b> ${forms.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(hits.length)html+=`<div class=\"fact-line corpus-line\"><b>קורפוס:</b> ${hits.map(h=>esc(h.label)).join(' / ')}</div>`;\n html+='</div>';return html;\n}\nfunction minimalMethodName(r){return String(r?.method?.name||'').split(' / ')[0].trim()}"
          assert old in s, "missing anchor: compact fact helpers"
          s=s.replace(old,new,1)
          old="function renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-count\">${rows.length} בחירות</div></div>`+rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><div class=\"card-actions\"><button class=\"copy-method\" data-copy-method=\"${r.method.key}\" title=\"העתק רק את הבחירה\">🧲</button><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></div><div class=\"badges\">${badgesFor(r.total)}</div><div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`).join('')}"
          new="function renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-count\">${rows.length} בחירות</div></div>`+rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><div class=\"card-actions\"><button class=\"copy-method\" data-copy-method=\"${r.method.key}\" title=\"העתק רק את הבחירה\">🧲</button><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></div>${compactFactsHtml(r.total)}<div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`).join('')}"
          assert old in s, "missing anchor: render compact facts"
          s=s.replace(old,new,1)
          old=" const a=analyzeNumber(r.total);let bx=x+w-28,by=y+64;\n const idx=a.prime?('Prime #'+a.primeIndex):(a.compositeIndex?('Composite #'+a.compositeIndex):'');\n if(idx)bx-=posterBadge(ctx,idx,bx,by,a.prime?'#b9f4c8':'#d5dde6',a.prime?'#2c6240':'#344353')+8;\n const hit=corpusHits(r.total)[0];if(hit)bx-=posterBadge(ctx,hit.label,bx,by,'#ffe2a0','#6f5a2d')+8;\n let yy=y+118;"
          new=" const a=analyzeNumber(r.total);let bx=x+w-28,by=y+64;\n const idx=a.prime?('Prime #'+a.primeIndex):(a.compositeIndex?('Composite #'+a.compositeIndex):'');\n if(idx)bx-=posterBadge(ctx,idx,bx,by,a.prime?'#b9f4c8':'#d5dde6',a.prime?'#2c6240':'#344353')+8;\n const hits=corpusHits(r.total);if(hits[0])bx-=posterBadge(ctx,hits[0].label,bx,by,'#ffe2a0','#6f5a2d')+8;\n const facts=`פירוק: ${fmtFactors(a.factors)}   φ=${fmt(a.phi)}   τ=${fmt(a.tau)}   σ=${fmt(a.sigma)}   rad=${fmt(a.rad)}`;\n posterText(ctx,facts,x+w-28,y+104,14,'650','#aebbc8','right','rtl',w-56);\n const adec=anchorDecompositions(r.total);if(adec.length)posterText(ctx,'עוגנים: '+adec.join(' · '),x+w-28,y+126,14,'650','#ffe2a0','right','rtl',w-56);\n if(hits.length>1)posterText(ctx,'קורפוס: '+hits.map(h=>h.label).join(' / '),x+w-28,y+148,13,'600','#bdf4f0','right','rtl',w-56);\n let yy=y+(hits.length>1?182:adec.length?160:142);"
          assert old in s, "missing anchor: poster facts"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show compact number theory facts and anchors in comparison cards"
          git push origin main
name: One-time Half Magnet Phrase Heading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure big half magnet starts with searched phrase
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="function allResultsBrokenText(){return current.results.map(brokenResultText).join('\\n')}"
          new="function allResultsBrokenText(){\n const q=document.getElementById('q').value.trim();\n const rows=current.results.map(r=>{\n  if(r?.repeatMeta)return `${fmt(r.total)} (${r.repeatMeta.methodName})`;\n  return `${fmt(r.total)} (${minimalMethodName(r)})`\n });\n return [q,'',...rows].join('\\n')\n}"
          assert old in s, "missing anchor: big half magnet must include searched phrase heading"
          s=s.replace(old,new,1)
          old="document.getElementById('copyAllBroken').addEventListener('click',async()=>{if(state.tab==='results'){const ok=await copyText(allResultsBrokenText());toast(ok?'המגנט השבור הועתק':'שגיאה בהעתקה');return}"
          new="document.getElementById('copyAllBroken').addEventListener('click',async()=>{if(state.tab==='results'){const ok=await copyText(allResultsBrokenText());toast(ok?'הפתגם + כל התוצאות הועתקו':'שגיאה בהעתקה');return}"
          assert old in s, "missing anchor: half magnet toast"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Include searched phrase in big half magnet"
          git push origin main
name: One-time Relations Mobile Layout Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix mobile relations cards
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          anchor="</style>"
          assert anchor in s, "style close not found"
          patch="\n/* Mobile relations: grow naturally with content instead of squeezing 6 rows into the viewport */\n@media(max-width:820px){\n  #tab-relations .panel{height:auto;overflow:visible}\n  .relations-layout{height:auto;display:block;overflow:visible}\n  .relation-summary{grid-template-columns:1fr 1fr;grid-template-rows:auto;gap:8px;margin-bottom:10px}\n  .relation-list{height:auto;min-height:0;overflow:visible;display:grid;grid-template-rows:none;grid-auto-rows:minmax(96px,auto);gap:8px}\n  .relation-row{min-height:96px;height:auto;grid-template-columns:1fr;gap:5px;align-items:start;padding:12px;overflow:hidden}\n  .relation-row .pair{min-width:0;font-size:18px;line-height:1.3;white-space:normal;overflow-wrap:anywhere;word-break:break-word}\n  .relation-row .why{font-size:12px;line-height:1.45;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}\n  .pager{padding:7px 0 2px}\n}\n@media(max-width:480px){\n  .relation-list{grid-auto-rows:minmax(104px,auto)}\n  .relation-row{min-height:104px;padding:12px 10px}\n  .relation-row .pair{font-size:17px}\n}\n"
          s=s.replace(anchor, patch+"\n"+anchor, 1)
          p.write_text(s,encoding="utf-8")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile relations list overflow and card sizing"
          git push origin main
name: One-time Repeat To Comparison

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make repeat cells selectable into comparison
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=".repeat-cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px;display:grid;grid-template-rows:auto 1fr auto;min-width:0;overflow:hidden}"
          new=".repeat-cell{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px;display:grid;grid-template-rows:auto 1fr auto;min-width:0;overflow:hidden;cursor:pointer;transition:.15s}\n.repeat-cell:hover{border-color:#5b6a7c;background:#121b25}\n.repeat-cell.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,173,85,.2),0 0 18px rgba(216,173,85,.08)}\n.repeat-add{position:absolute;left:6px;top:5px;font-size:13px;color:#8e9aa8;line-height:1}\n.repeat-cell.selected .repeat-add{color:#ffe2a0}"
          assert old in s, "missing anchor: repeat clickable css"
          s=s.replace(old,new,1)
          old="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],selectionTouched:false,lastScript:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          new="const state={tab:'results',category:'base',methodKey:null,selectedMethods:[],derivedSelections:[],selectionTouched:false,lastScript:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          assert old in s, "missing anchor: derived state"
          s=s.replace(old,new,1)
          old="function richBreakdownHtml(r){return r?.words?.length?r.words.map(w=>wordBreakdownHtml(r,w)).join(''):'<div class=\"tiny\">אין פירוק</div>'}"
          new="function richBreakdownHtml(r){\n if(r?.repeatMeta)return `<div class=\"transform-note\"><b>${esc(r.repeatMeta.phrase)}</b> ×${r.repeatMeta.count} · ${esc(r.repeatMeta.methodName)} = <b>${fmt(r.total)}</b></div>`;\n return r?.words?.length?r.words.map(w=>wordBreakdownHtml(r,w)).join(''):'<div class=\"tiny\">אין פירוק</div>'\n}"
          assert old in s, "missing anchor: compact repeat breakdown"
          s=s.replace(old,new,1)
          old="function minimalResultText(r){\n const q=document.getElementById('q').value.trim();\n if(r?.method?.key==='perati'&&r.words?.length){"
          new="function minimalResultText(r){\n const q=document.getElementById('q').value.trim();\n if(r?.repeatMeta)return `${r.repeatMeta.phrase} ×${r.repeatMeta.count} = ${fmt(r.total)} (${r.repeatMeta.methodName})`;\n if(r?.method?.key==='perati'&&r.words?.length){"
          assert old in s, "missing anchor: repeat magnet text"
          s=s.replace(old,new,1)
          old="function renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-actions\"><button data-copy-selected title=\"העתק את כל הבחירות שסומנו\">🧲</button><button class=\"math-magnet\" data-copy-selected-math title=\"העתק את כל הבחירות + מתמטיקה\">🧲∑</button><div class=\"stage-count\">${rows.length} בחירות</div></div></div>`+rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><div class=\"card-actions\"><button class=\"copy-rich-method\" data-copy-rich-method=\"${r.method.key}\" title=\"העתק בחירה + פירוקים ותכונות\">🧲∑</button><button class=\"copy-method\" data-copy-method=\"${r.method.key}\" title=\"העתק רק את הבחירה\">🧲</button><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"mn\" style=\"font-size:${compactMethodFont(r.method.name)}px\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></div>${compactFactsHtml(r.total)}<div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`).join('')}"
          new="function resultSelectionKey(r){return r?.selectionKey||r?.method?.key||''}\nfunction resultDisplayName(r){return r?.displayName||r?.method?.name||''}\nfunction selectedResultByKey(key){return selectedResults().find(r=>resultSelectionKey(r)===key)}\nfunction renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-actions\"><button data-copy-selected title=\"העתק את כל הבחירות שסומנו\">🧲</button><button class=\"math-magnet\" data-copy-selected-math title=\"העתק את כל הבחירות + מתמטיקה\">🧲∑</button><div class=\"stage-count\">${rows.length} בחירות</div></div></div>`+rows.map(r=>{const sk=resultSelectionKey(r),dn=resultDisplayName(r);return `<div class=\"multi-detail-card\" data-detail-method=\"${esc(sk)}\"><div class=\"mh\"><div class=\"card-actions\"><button class=\"copy-rich-method\" data-copy-rich-method=\"${esc(sk)}\" title=\"העתק בחירה + פירוקים ותכונות\">🧲∑</button><button class=\"copy-method\" data-copy-method=\"${esc(sk)}\" title=\"העתק רק את הבחירה\">🧲</button><button class=\"remove-method\" data-remove-method=\"${esc(sk)}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"mn\" style=\"font-size:${compactMethodFont(dn)}px\">${esc(dn)}</div><div class=\"mv\">${fmt(r.total)}</div></div>${compactFactsHtml(r.total)}<div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`}).join('')}"
          assert old in s, "missing anchor: derived-aware cards"
          s=s.replace(old,new,1)
          old=" const selected=state.selectedMethods.map(k=>current.results.find(r=>r.method.key===k)).filter(Boolean);const pane=document.getElementById('detailPane');if(selected.length){renderMultiDetails(selected);return}"
          new=" const selected=selectedResults();const pane=document.getElementById('detailPane');if(selected.length){renderMultiDetails(selected);return}"
          assert old in s, "missing anchor: render selected derived"
          s=s.replace(old,new,1)
          old="function renderRepeat(){const phrase=document.getElementById('repeatPhrase').value||document.getElementById('q').value;const script=detectScript(phrase);const methods=METHODS[script];const sel=document.getElementById('repeatMethod');const old=sel.value;sel.innerHTML=methods.map(m=>`<option value=\"${m.key}\" ${m.key===old?'selected':''}>${esc(m.name)}</option>`).join('');if(!sel.value)sel.value=methods[0]?.key||'';const m=methods.find(x=>x.key===sel.value)||methods[0];const max=Math.min(24,Math.max(1,Number(document.getElementById('repeatMax').value)||12));const cells=[];for(let n=1;n<=max;n++){const text=Array(n).fill(phrase).join(' ');const r=calculate(text,script,m);const hit=corpusHits(r.total)[0];cells.push(`<div class=\"repeat-cell\"><div class=\"repeat-n\">×${n}</div><div class=\"repeat-v\">${fmt(r.total)}</div><div class=\"repeat-hit\">${hit?esc(hit.label):''}</div></div>`)}const per=12,pages=Math.max(1,Math.ceil(max/per));state.repeatPage=Math.min(state.repeatPage,pages-1);document.getElementById('repeatGrid').innerHTML=cells.slice(state.repeatPage*per,state.repeatPage*per+per).join('');document.getElementById('repeatPage').textContent=`${state.repeatPage+1}/${pages}`;document.getElementById('repeatPrev').disabled=state.repeatPage===0;document.getElementById('repeatNext').disabled=state.repeatPage>=pages-1;document.getElementById('repeatNote').textContent=`${m.name} · ${phrase}`}"
          new="function repeatSelectionKey(script,methodKey,n,phrase){return 'repeat:'+script+':'+methodKey+':'+n+':'+normText(phrase)}\nfunction makeRepeatSelection(phrase,script,m,n){\n const text=Array(n).fill(phrase).join(' '),r=calculate(text,script,m);\n r.selectionKey=repeatSelectionKey(script,m.key,n,phrase);\n r.displayName=m.name+' ×'+n;\n r.repeatMeta={phrase,count:n,methodName:m.name,methodKey:m.key};\n return r\n}\nfunction renderRepeat(){const phrase=document.getElementById('repeatPhrase').value||document.getElementById('q').value;const script=detectScript(phrase);const methods=METHODS[script];const sel=document.getElementById('repeatMethod');const old=sel.value;sel.innerHTML=methods.map(m=>`<option value=\"${m.key}\" ${m.key===old?'selected':''}>${esc(m.name)}</option>`).join('');if(!sel.value)sel.value=methods[0]?.key||'';const m=methods.find(x=>x.key===sel.value)||methods[0];const max=Math.min(24,Math.max(1,Number(document.getElementById('repeatMax').value)||12));const cells=[];for(let n=1;n<=max;n++){const r=makeRepeatSelection(phrase,script,m,n),hit=corpusHits(r.total)[0],selected=state.derivedSelections.some(x=>x.selectionKey===r.selectionKey);cells.push(`<div class=\"repeat-cell ${selected?'selected':''}\" data-repeat-n=\"${n}\" data-repeat-key=\"${esc(r.selectionKey)}\" title=\"לחץ להוסיף/להסיר ממרכז ההשוואה\"><span class=\"repeat-add\">${selected?'✓':'＋'}</span><div class=\"repeat-n\">${esc(m.name)} ×${n}</div><div class=\"repeat-v\">${fmt(r.total)}</div><div class=\"repeat-hit\">${hit?esc(hit.label):''}</div></div>`)}const per=12,pages=Math.max(1,Math.ceil(max/per));state.repeatPage=Math.min(state.repeatPage,pages-1);document.getElementById('repeatGrid').innerHTML=cells.slice(state.repeatPage*per,state.repeatPage*per+per).join('');document.getElementById('repeatPage').textContent=`${state.repeatPage+1}/${pages}`;document.getElementById('repeatPrev').disabled=state.repeatPage===0;document.getElementById('repeatNext').disabled=state.repeatPage>=pages-1;document.getElementById('repeatNote').textContent=`${m.name} · ${phrase}`}"
          assert old in s, "missing anchor: clickable repeat results"
          s=s.replace(old,new,1)
          old="function selectedResults(){return state.selectedMethods.map(function(k){return current.results.find(function(r){return r.method.key===k})}).filter(Boolean)}"
          new="function selectedResults(){\n const base=state.selectedMethods.map(function(k){return current.results.find(function(r){return r.method.key===k})}).filter(Boolean);\n return base.concat(state.derivedSelections||[])\n}"
          assert old in s, "missing anchor: selectedResults includes derived"
          s=s.replace(old,new,1)
          old=" const rich=e.target.closest('[data-copy-rich-method]');if(rich){const r=current.results.find(x=>x.method.key===rich.dataset.copyRichMethod);if(!r)return;const ok=await copyText(richMagnetText(r));toast(ok?'הבחירה + מתמטיקה הועתקה':'שגיאה בהעתקה');return}\n const c=e.target.closest('[data-copy-method]');if(c){const r=current.results.find(x=>x.method.key===c.dataset.copyMethod);if(!r)return;const ok=await copyText(minimalResultText(r));toast(ok?'הבחירה הועתקה':'שגיאה בהעתקה');return}\n const b=e.target.closest('[data-remove-method]');if(!b)return;const key=b.dataset.removeMethod;state.selectedMethods=state.selectedMethods.filter(k=>k!==key);if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];state.methodKey=state.selectedMethods[state.selectedMethods.length-1]||state.methodKey;renderResults()"
          new=" const rich=e.target.closest('[data-copy-rich-method]');if(rich){const r=selectedResultByKey(rich.dataset.copyRichMethod);if(!r)return;const ok=await copyText(richMagnetText(r));toast(ok?'הבחירה + מתמטיקה הועתקה':'שגיאה בהעתקה');return}\n const c=e.target.closest('[data-copy-method]');if(c){const r=selectedResultByKey(c.dataset.copyMethod);if(!r)return;const ok=await copyText(minimalResultText(r));toast(ok?'הבחירה הועתקה':'שגיאה בהעתקה');return}\n const b=e.target.closest('[data-remove-method]');if(!b)return;const key=b.dataset.removeMethod;if(key.startsWith('repeat:'))state.derivedSelections=state.derivedSelections.filter(x=>x.selectionKey!==key);else state.selectedMethods=state.selectedMethods.filter(k=>k!==key);if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];state.methodKey=state.selectedMethods[state.selectedMethods.length-1]||state.methodKey;renderResults();renderRepeat()"
          assert old in s, "missing anchor: derived copy/remove"
          s=s.replace(old,new,1)
          old="['repeatPhrase','repeatMethod','repeatMax'].forEach(id=>document.getElementById(id).addEventListener(id==='repeatPhrase'?'input':'change',()=>{state.repeatPage=0;renderRepeat()}));document.getElementById('repeatPrev').addEventListener('click',()=>{state.repeatPage=Math.max(0,state.repeatPage-1);renderRepeat()});document.getElementById('repeatNext').addEventListener('click',()=>{state.repeatPage++;renderRepeat()});"
          new="['repeatPhrase','repeatMethod','repeatMax'].forEach(id=>document.getElementById(id).addEventListener(id==='repeatPhrase'?'input':'change',()=>{state.repeatPage=0;renderRepeat()}));\ndocument.getElementById('repeatGrid').addEventListener('click',e=>{const cell=e.target.closest('[data-repeat-n]');if(!cell)return;const phrase=document.getElementById('repeatPhrase').value||document.getElementById('q').value,script=detectScript(phrase),methods=METHODS[script],m=methods.find(x=>x.key===document.getElementById('repeatMethod').value)||methods[0],n=Number(cell.dataset.repeatN),r=makeRepeatSelection(phrase,script,m,n),i=state.derivedSelections.findIndex(x=>x.selectionKey===r.selectionKey);if(i>=0){state.derivedSelections.splice(i,1);toast('הוסר ממרכז ההשוואה')}else{state.derivedSelections.push(r);state.selectionTouched=true;toast('נוסף להשוואה: '+m.name+' ×'+n)}renderRepeat();renderResults()});\ndocument.getElementById('repeatPrev').addEventListener('click',()=>{state.repeatPage=Math.max(0,state.repeatPage-1);renderRepeat()});document.getElementById('repeatNext').addEventListener('click',()=>{state.repeatPage++;renderRepeat()});"
          assert old in s, "missing anchor: repeat click event"
          s=s.replace(old,new,1)
          old="console.assert(T('אשר א אהיה משה אשר','he','reduced')===37,'Asher Aleph Ehyeh Moshe Asher reduced 37');"
          new="console.assert(T('אשר א אהיה משה אשר','he','reduced')===37,'Asher Aleph Ehyeh Moshe Asher reduced 37');\nconsole.assert(T('משה','he','atbash')===102,'Moshe Atbash 102');\nconsole.assert(T('משה משה משה משה משה משה משה משה','he','atbash')===816,'Moshe x8 Atbash 816');"
          assert old in s, "missing anchor: repeat 816 self tests"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Allow repeat results to be added to comparison"
          git push origin main
name: One-time Compact Divisors Properties

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add compact divisors and properties
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="function compactFactsHtml(n){\n const a=analyzeNumber(n);if(!a)return'';\n const idx=a.prime?`Prime #${a.primeIndex}`:(a.compositeIndex?`Composite #${a.compositeIndex}`:'');\n const core=[idx, `פירוק: ${fmtFactors(a.factors)}`, `φ=${fmt(a.phi)}`, `τ=${fmt(a.tau)}`, `σ=${fmt(a.sigma)}`, `rad=${fmt(a.rad)}`].filter(Boolean);\n const anchors=anchorDecompositions(n);\n const forms=(a.forms||[]).concat(a.binom||[]).slice(0,4);\n const hits=corpusHits(n);\n let html=`<div class=\"compact-facts\"><div class=\"fact-line\">${core.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(anchors.length)html+=`<div class=\"fact-line anchor-line\"><b>עוגנים:</b> ${anchors.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(forms.length)html+=`<div class=\"fact-line\"><b>צורות:</b> ${forms.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(hits.length)html+=`<div class=\"fact-line corpus-line\"><b>קורפוס:</b> ${hits.map(h=>esc(h.label)).join(' / ')}</div>`;\n html+='</div>';return html;\n}"
          new="function divisorsOf(n){\n const ds=[];for(const [a,b] of factorPairs(n)){ds.push(a);if(b!==a)ds.push(b)}\n return ds.sort((x,y)=>x-y)\n}\nfunction compactDivisorText(n){\n const ds=divisorsOf(n);\n if(ds.length<=16)return ds.map(fmt).join(', ');\n return ds.slice(0,9).map(fmt).join(', ')+' … '+ds.slice(-5).map(fmt).join(', ')\n}\nfunction compactFactsHtml(n){\n const a=analyzeNumber(n);if(!a)return'';\n const idx=a.prime?`Prime #${a.primeIndex}`:(a.compositeIndex?`Composite #${a.compositeIndex}`:'');\n const core=[idx, `פירוק: ${fmtFactors(a.factors)}`, `φ=${fmt(a.phi)}`, `τ=${fmt(a.tau)}`, `σ=${fmt(a.sigma)}`, `rad=${fmt(a.rad)}`].filter(Boolean);\n const anchors=anchorDecompositions(n);\n const forms=(a.forms||[]).concat(a.binom||[]).slice(0,4);\n const hits=corpusHits(n);\n const props=[a.aliquot,a.squarefree?'Squarefree':'',a.powerful?'Powerful':'',`DR=${a.root}`].filter(Boolean);\n let html=`<div class=\"compact-facts\"><div class=\"fact-line\">${core.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n html+=`<div class=\"fact-line\"><b>מחלקים (${a.tau}):</b> ${esc(compactDivisorText(n))}</div>`;\n if(props.length)html+=`<div class=\"fact-line\"><b>תכונות:</b> ${props.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(anchors.length)html+=`<div class=\"fact-line anchor-line\"><b>עוגנים:</b> ${anchors.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(forms.length)html+=`<div class=\"fact-line\"><b>צורות:</b> ${forms.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(hits.length)html+=`<div class=\"fact-line corpus-line\"><b>קורפוס:</b> ${hits.map(h=>esc(h.label)).join(' / ')}</div>`;\n html+='</div>';return html;\n}"
          assert old in s, "missing anchor: divisors and properties in compact facts"
          s=s.replace(old,new,1)
          old=" const facts=`פירוק: ${fmtFactors(a.factors)}   φ=${fmt(a.phi)}   τ=${fmt(a.tau)}   σ=${fmt(a.sigma)}   rad=${fmt(a.rad)}`;\n posterText(ctx,facts,x+w-28,y+104,14,'650','#aebbc8','right','rtl',w-56);\n const adec=anchorDecompositions(r.total);if(adec.length)posterText(ctx,'עוגנים: '+adec.join(' · '),x+w-28,y+126,14,'650','#ffe2a0','right','rtl',w-56);\n if(hits.length>1)posterText(ctx,'קורפוס: '+hits.map(h=>h.label).join(' / '),x+w-28,y+148,13,'600','#bdf4f0','right','rtl',w-56);\n let yy=y+(hits.length>1?182:adec.length?160:142);"
          new=" const facts=`פירוק: ${fmtFactors(a.factors)}   φ=${fmt(a.phi)}   τ=${fmt(a.tau)}   σ=${fmt(a.sigma)}   rad=${fmt(a.rad)}`;\n posterText(ctx,facts,x+w-28,y+104,14,'650','#aebbc8','right','rtl',w-56);\n posterText(ctx,'מחלקים: '+compactDivisorText(r.total),x+w-28,y+126,13,'600','#cbd7e3','right','rtl',w-56);\n const props=[a.aliquot,a.squarefree?'Squarefree':'',a.powerful?'Powerful':'','DR='+a.root].filter(Boolean).join(' · ');\n posterText(ctx,'תכונות: '+props,x+w-28,y+146,13,'600','#cbd7e3','right','rtl',w-56);\n const adec=anchorDecompositions(r.total);if(adec.length)posterText(ctx,'עוגנים: '+adec.join(' · '),x+w-28,y+166,14,'650','#ffe2a0','right','rtl',w-56);\n if(hits.length>1)posterText(ctx,'קורפוס: '+hits.map(h=>h.label).join(' / '),x+w-28,y+186,13,'600','#bdf4f0','right','rtl',w-56);\n let yy=y+(hits.length>1?218:adec.length?198:178);"
          assert old in s, "missing anchor: poster divisors and properties"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add compact divisors and properties to comparison cards"
          git push origin main
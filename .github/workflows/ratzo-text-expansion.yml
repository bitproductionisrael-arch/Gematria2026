name: One-time Ratzo Text Expansion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show textual Ratzo VaShov path and add new anchors
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="function wordDescription(r,idx){if(r.milui){const w=r.words[idx];if(!w)return'אין פירוק';return `${w.raw}\\n${w.parts.map(p=>`${p.letter}→${p.name}(${p.value})`).join(' + ')}\\n= ${w.subtotal}`}\n const w=r.words[idx];if(!w)return'אין פירוק';const m=r.method;const base=w.toks.map((t,i)=>{let lab=t.label;if(m.sub&&m.sub[t.base])lab+=`→${m.sub[t.base]}`;return `${lab}(${w.baseVals[i]})`}).join(' + ');let out=`${w.raw}\\n${base}`;if(m.transform)out+=`\\n${m.transformName}: [${w.vals.join(', ')}]\\n= ${sum(w.vals)}`;else if(m.fold==='word')out+=`\\n= ${sum(w.vals)} → ${w.folded}`;else out+=`\\n= ${sum(w.baseVals)}`;if(m.post)out+=`\\nכולל/מוספי → ${r.total}`;return out}"
          new="function ratzoTextTerms(w){\n const letters=w.toks.map(t=>t.label),prefix=[];\n for(let i=0;i<letters.length;i++)prefix.push(letters.slice(0,i+1).join(''));\n return prefix.concat(prefix.slice(0,-1).reverse())\n}\nfunction ratzoAnnotatedTerms(w){\n const terms=ratzoTextTerms(w);\n return terms.map((term,i)=>`${term}(${fmt(w.vals[i])})`)\n}\nfunction wordDescription(r,idx){if(r.milui){const w=r.words[idx];if(!w)return'אין פירוק';return `${w.raw}\\n${w.parts.map(p=>`${p.letter}→${p.name}(${p.value})`).join(' + ')}\\n= ${w.subtotal}`}\n const w=r.words[idx];if(!w)return'אין פירוק';const m=r.method;const base=w.toks.map((t,i)=>{let lab=t.label;if(m.sub&&m.sub[t.base])lab+=`→${m.sub[t.base]}`;return `${lab}(${w.baseVals[i]})`}).join(' + ');let out=`${w.raw}\\n${base}`;if(m.key==='ratzo')out+=`\\nרצוא ושוב: ${ratzoAnnotatedTerms(w).join(' + ')}\\n= ${sum(w.vals)}`;else if(m.transform)out+=`\\n${m.transformName}: [${w.vals.join(', ')}]\\n= ${sum(w.vals)}`;else if(m.fold==='word')out+=`\\n= ${sum(w.vals)} → ${w.folded}`;else out+=`\\n= ${sum(w.baseVals)}`;if(m.post)out+=`\\nכולל/מוספי → ${r.total}`;return out}"
          assert old in s, "missing anchor: ratzo textual description"
          s=s.replace(old,new,1)
          old=" const m=r.method;const chips=w.toks.map((t,i)=>{const sub=m.sub&&m.sub[t.base]?`<small>${esc(t.label)}→${esc(m.sub[t.base])}</small>`:'';return `<span class=\"letter-chip\"><b>${esc(t.label)}</b>${sub}<strong>${fmt(w.baseVals[i])}</strong></span>`}).join('');let note='';if(m.transform)note=`<div class=\"transform-note\">${esc(m.transformName)} · <b>${esc(w.vals.join(' + '))}</b> = <b>${fmt(sum(w.vals))}</b></div>`;else if(m.fold==='word')note=`<div class=\"transform-note\">${fmt(sum(w.vals))} → <b>${fmt(w.folded)}</b></div>`;const subtotal=m.fold==='word'?w.folded:(m.transform?sum(w.vals):sum(w.baseVals));return `<div class=\"word-block\"><div class=\"word-title\">${esc(w.raw)}</div><div class=\"letter-grid\">${chips}</div>${note}<div class=\"word-total\"><span>סכום</span><b>${fmt(subtotal)}</b></div></div>`"
          new=" const m=r.method;const chips=w.toks.map((t,i)=>{const sub=m.sub&&m.sub[t.base]?`<small>${esc(t.label)}→${esc(m.sub[t.base])}</small>`:'';return `<span class=\"letter-chip\"><b>${esc(t.label)}</b>${sub}<strong>${fmt(w.baseVals[i])}</strong></span>`}).join('');let note='';if(m.key==='ratzo')note=`<div class=\"transform-note\"><b>רצוא ושוב:</b> ${ratzoAnnotatedTerms(w).map(esc).join(' + ')} = <b>${fmt(sum(w.vals))}</b></div>`;else if(m.transform)note=`<div class=\"transform-note\">${esc(m.transformName)} · <b>${esc(w.vals.join(' + '))}</b> = <b>${fmt(sum(w.vals))}</b></div>`;else if(m.fold==='word')note=`<div class=\"transform-note\">${fmt(sum(w.vals))} → <b>${fmt(w.folded)}</b></div>`;const subtotal=m.fold==='word'?w.folded:(m.transform?sum(w.vals):sum(w.baseVals));return `<div class=\"word-block\"><div class=\"word-title\">${esc(w.raw)}</div><div class=\"letter-grid\">${chips}</div>${note}<div class=\"word-total\"><span>סכום</span><b>${fmt(subtotal)}</b></div></div>`"
          assert old in s, "missing anchor: ratzo visual terms"
          s=s.replace(old,new,1)
          old=" if(m.key==='perati'){\n  return w.toks.map((t,i)=>{const base=peratiBaseValue(t);return t.label+'²=('+fmt(base)+'²='+fmt(w.baseVals[i])+')'}).join(' ')\n }\n if(m.transform){\n  return w.vals.map(v=>fmt(v)).join(' + ')+' = '+fmt(sum(w.vals))\n }"
          new=" if(m.key==='perati'){\n  return w.toks.map((t,i)=>{const base=peratiBaseValue(t);return t.label+'²=('+fmt(base)+'²='+fmt(w.baseVals[i])+')'}).join(' ')\n }\n if(m.key==='ratzo'){\n  return ratzoAnnotatedTerms(w).join(' + ')+' = '+fmt(sum(w.vals))\n }\n if(m.transform){\n  return w.vals.map(v=>fmt(v)).join(' + ')+' = '+fmt(sum(w.vals))\n }"
          assert old in s, "missing anchor: ratzo magnet terms"
          s=s.replace(old,new,1)
          old=" if(r.method.transform)posterText(ctx,r.method.transformName+': '+w.vals.join(' + ')+' = '+sum(w.vals),x+20,totalY+2,13,'500','#9fb0c2','left','ltr',width-150);"
          new=" if(r.method.key==='ratzo')posterText(ctx,'רצוא ושוב: '+ratzoAnnotatedTerms(w).join(' + ')+' = '+sum(w.vals),x+20,totalY+2,12,'500','#9fb0c2','left','rtl',width-150);\n else if(r.method.transform)posterText(ctx,r.method.transformName+': '+w.vals.join(' + ')+' = '+sum(w.vals),x+20,totalY+2,13,'500','#9fb0c2','left','ltr',width-150);"
          assert old in s, "missing anchor: ratzo poster terms"
          s=s.replace(old,new,1)
          old=" [14,'דוד','Hebrew Reduced / Regular'],[21,'אהיה','Hebrew Regular'],[24,'דויד','Hebrew Regular'],[26,'יהוה','Hebrew Regular'],[27,'יהוה עם הכולל','Hebrew Kolel'],[32,'לב','Hebrew Regular'],[37,'יחידה','Hebrew Regular / Ordinal'],[38,'Mike','English Simple'],"
          new=" [14,'דוד','Hebrew Reduced / Regular'],[18,'חי','Hebrew Regular'],[21,'אהיה','Hebrew Regular'],[24,'דויד','Hebrew Regular'],[26,'יהוה','Hebrew Regular'],[27,'יהוה עם הכולל','Hebrew Kolel'],[28,'רוב','Hebrew Ordinal · Composite #18'],[32,'לב','Hebrew Regular'],[37,'יחידה','Hebrew Regular / Ordinal'],[38,'Mike','English Simple'],"
          assert old in s, "missing anchor: add 18 and 28 corpus"
          s=s.replace(old,new,1)
          old="[52,'משיח / מייק','Hebrew Ordinal'],[55,'Rov','English Simple'],[58,'Atbash(עמית) / מחיקת יהוה','Research'],[59,'בלייז','Hebrew Regular'],"
          new="[52,'משיח / מייק','Hebrew Ordinal'],[55,'Rov / הכל','English Simple / Hebrew Regular'],[58,'Atbash(עמית) / מחיקת יהוה','Research'],[59,'בלייז','Hebrew Regular'],"
          assert old in s, "missing anchor: add hakol 55"
          s=s.replace(old,new,1)
          old="[72,'יהוה באחוריים','Hebrew Achorayim'],[74,'Mike','English Regular'],[77,'מזל','Hebrew Regular'],[86,'אלהים / אלהימ','Hebrew Regular'],"
          new="[72,'יהוה באחוריים','Hebrew Achorayim'],[74,'Mike','English Regular'],[77,'מזל / בלייז חי','Hebrew Regular'],[82,'בראשית א:א / רוב','Hebrew Reduced / AIQ BKR'],[86,'אלהים / אלהימ','Hebrew Regular'],"
          assert old in s, "missing anchor: add 77 and 82 corpus"
          s=s.replace(old,new,1)
          old="[1177,'תיקון תורה','Hebrew Regular'],[1316,'אלהימ','Addition & Subtraction'],[1369,'37²','Number'],[1408,'ΣΩΤΗΡ','Greek Isopsephy'],"
          new="[1177,'תיקון תורה','Hebrew Regular'],[1316,'אלהימ','Addition & Subtraction'],[1369,'37² / בלייז רוב חי','Number / Ratzo VaShov'],[1408,'ΣΩΤΗΡ','Greek Isopsephy'],"
          assert old in s, "missing anchor: add 1369 corpus label"
          s=s.replace(old,new,1)
          old="console.assert(T('חכמה','he','reverseOrdinal')===55,'Hokhmah reverse ordinal 55');"
          new="console.assert(T('חכמה','he','reverseOrdinal')===55,'Hokhmah reverse ordinal 55');\nconsole.assert(compositeIndex(28)===18,'28 composite #18 = Chai');\nconsole.assert(T('רוב','he','ordinal')===28,'Rov ordinal 28');\nconsole.assert(T('רוב','he','ayak')===82,'Rov AIQ BKR 82');\nconsole.assert(T('בלייז חי','he','regular')===77,'Blaze Chai regular 77');\nconsole.assert(T('בלייז חי','he','ordinal')===59,'Blaze Chai ordinal 59');\nconsole.assert(compositeIndex(77)===55,'77 composite #55 = Hakol');\nconsole.assert(T('בלייז רוב חי','he','ratzo')===1369,'Blaze Rov Chai Ratzo 1369');"
          assert old in s, "missing anchor: new anchor tests"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show Ratzo VaShov text path and add Blaze Chai anchors"
          git push origin main
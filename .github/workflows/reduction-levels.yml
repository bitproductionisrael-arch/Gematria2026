name: One-time Reduction Levels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename Reduction 1 and annotate traditional Reduced as Reduction 2
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="  {key:'reduced',cat:'base',name:'גימטריה קטנה / Reduced',map:HE_KATAN},"
          new="  {key:'reduced',cat:'base',name:'גימטריה קטנה / Reduced',map:HE_KATAN,aliasNote:'≡ צמצום №2'},"
          assert old in s, "missing anchor: traditional reduced alias note"
          s=s.replace(old,new,1)
          old="  {key:'zeroStep',cat:'base',name:'צמצום אפס אחד / One-step Zero',map:HE_ZERO_STEP,research:true},"
          new="  {key:'zeroStep',cat:'base',name:'צמצום №1 / Reduction №1',map:HE_ZERO_STEP,research:true},"
          assert old in s, "missing anchor: rename zero step"
          s=s.replace(old,new,1)
          old="function resultDisplayName(r){return r?.displayName||r?.method?.name||''}"
          new="function resultDisplayName(r){return r?.displayName||r?.method?.name||''}\nfunction methodAliasNote(r){return r?.method?.aliasNote||''}"
          assert old in s, "missing anchor: alias helper"
          s=s.replace(old,new,1)
          old="<div class=\"mn\" style=\"font-size:${compactMethodFont(dn)}px\">${esc(dn)}</div><div class=\"mv\">${fmt(r.total)}</div>"
          new="<div class=\"mn\" style=\"font-size:${compactMethodFont(dn)}px\">${esc(dn)}${methodAliasNote(r)?`<div class=\"tiny\" style=\"margin-top:3px;opacity:.72\">${esc(methodAliasNote(r))}</div>`:''}</div><div class=\"mv\">${fmt(r.total)}</div>"
          assert old in s, "missing anchor: alias in selected card"
          s=s.replace(old,new,1)
          old="document.getElementById('methodGrid').innerHTML=group.map(r=>`<button class=\"method-btn ${state.selectedMethods.includes(r.method.key)?'active':''}\" data-method=\"${r.method.key}\"><div class=\"mn\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></button>`).join('');"
          new="document.getElementById('methodGrid').innerHTML=group.map(r=>`<button class=\"method-btn ${state.selectedMethods.includes(r.method.key)?'active':''}\" data-method=\"${r.method.key}\"><div class=\"mn\">${esc(r.method.name)}${r.method.aliasNote?`<div class=\"tiny\" style=\"margin-top:2px;opacity:.7\">${esc(r.method.aliasNote)}</div>`:''}</div><div class=\"mv\">${fmt(r.total)}</div></button>`).join('');"
          assert old in s, "missing anchor: alias in method grid"
          s=s.replace(old,new,1)
          old="document.getElementById('detailName').textContent=r.method.name;document.getElementById('detailHint').textContent=r.method.research?'אופרטור מחקר — נשמר בנפרד משיטות מסורתיות':'';"
          new="document.getElementById('detailName').textContent=r.method.name;document.getElementById('detailHint').textContent=r.method.aliasNote?r.method.aliasNote:(r.method.research?'אופרטור מחקר — נשמר בנפרד משיטות מסורתיות':'');"
          assert old in s, "missing anchor: alias in detail hint"
          s=s.replace(old,new,1)
          old="console.assert(T('עמית מייק רוב','he','zeroStep')===96,'Hebrew one-step zero 96');"
          new="console.assert(T('עמית מייק רוב','he','zeroStep')===96,'Hebrew Reduction №1 96');\nconsole.assert(T('תור','he','zeroStep')===66,'תור Reduction №1 = 66');\nconsole.assert(T('תור','he','reduced')===12,'תור traditional Reduced = 12 = Reduction №2');"
          assert old in s, "missing anchor: reduction self tests"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify reduction levels while preserving traditional Reduced"
          git push origin main
name: One-time Building Milestone Symbols

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace verbose milestone labels with symbols
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="  {i:0,label:'פוזיציה 1'},\n  {i:1,label:'פוזיציה 2'},\n  {i:2,label:'פוזיציה 3'},\n  {i:4,label:'פוזיציה 5'},\n  {i:n-3,label:'שתיים לפני האחרונה'},\n  {i:n-1,label:'האחרונה'}"
          new="  {i:0,label:'①'},\n  {i:1,label:'②'},\n  {i:2,label:'③'},\n  {i:4,label:'⑤'},\n  {i:n-3,label:'◀²'},\n  {i:n-1,label:'Ω'}"
          assert old in s, "missing anchor: replace milestone words with symbols"
          s=s.replace(old,new,1)
          old="console.assert(buildingMilestoneText(_malBuilding.words[0])==='אבני דרך: פוזיציה 1 13=אחד · פוזיציה 2 14=דוד · פוזיציה 3 26=יהוה · פוזיציה 5 37=יחידה · שתיים לפני האחרונה 74=Mike · האחרונה 82=בראשית א:א','Malchisedec milestone anchors');"
          new="console.assert(buildingMilestoneText(_malBuilding.words[0])==='אבני דרך: ① 13=אחד · ② 14=דוד · ③ 26=יהוה · ⑤ 37=יחידה · ◀² 74=Mike · Ω 82=בראשית א:א','Malchisedec milestone anchors');"
          assert old in s, "missing anchor: update milestone self test"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use symbols for Building milestone anchors"
          git push origin main
name: One-time Magnet Scope Matrix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore all/selected/single magnet scopes and math variants
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="<div class=\"top-actions\">\n      <button id=\"copyAll\" class=\"iconbtn\" title=\"העתק בחירה פעילה / טאב\">🧲</button>\n      <button id=\"saveView\" class=\"iconbtn\" title=\"צלם בחירה פעילה / טאב\">📸</button>\n    </div>"
          new="<div class=\"top-actions\">\n      <button id=\"copyAll\" class=\"iconbtn\" title=\"העתק את כל שיטות הגימטריה\">🧲</button>\n      <button id=\"copyAllMath\" class=\"iconbtn math-magnet\" title=\"העתק את כל השיטות + פירוקים ותכונות מתמטיות\">🧲∑</button>\n      <button id=\"saveView\" class=\"iconbtn\" title=\"צלם בחירה פעילה / טאב\">📸</button>\n    </div>"
          assert old in s, "missing anchor: top magnet buttons"
          s=s.replace(old,new,1)
          old=".multi-detail-card .remove-method,.multi-detail-card .copy-method{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:10px;z-index:2}\n.multi-detail-card .copy-method{border-color:#326c69;color:#bdf4f0}"
          new=".multi-detail-card .remove-method,.multi-detail-card .copy-method,.multi-detail-card .copy-rich-method{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:10px;z-index:2}\n.multi-detail-card .copy-method{border-color:#326c69;color:#bdf4f0}\n.multi-detail-card .copy-rich-method,.math-magnet{border-color:#6f5a2d;color:#ffe2a0;font-weight:850}\n.multi-detail-card .copy-rich-method{width:44px;font-size:11px}\n.stage-actions{display:flex;align-items:center;gap:5px}\n.stage-actions button{height:32px;min-width:36px;padding:0 7px;border-radius:9px;font-size:12px}"
          assert old in s, "missing anchor: magnet css"
          s=s.replace(old,new,1)
          old="  .multi-detail-card .remove-method,\n  .multi-detail-card .copy-method{\n    width:30px;height:30px;border-radius:9px;\n  }"
          new="  .multi-detail-card .remove-method,\n  .multi-detail-card .copy-method,\n  .multi-detail-card .copy-rich-method{\n    width:30px;height:30px;border-radius:9px;\n  }\n  .multi-detail-card .copy-rich-method{width:40px;font-size:10px}\n  .stage-actions button{height:30px;min-width:32px;font-size:10px}"
          assert old in s, "missing anchor: mobile magnet css"
          s=s.replace(old,new,1)
          old="const CARD_ANCHORS=[24,37,43,55,72,111,136,222];\nfunction anchorDecompositions(n){\n const out=[];\n for(const a of CARD_ANCHORS){if(n>a&&n%a===0)out.push(`${fmt(n/a)}×${a}`)}\n return out;\n}"
          new="const CARD_ANCHORS=[1024,888,768,666,640,576,543,520,512,444,384,368,344,316,296,288,232,222,216,208,160,148,141,136,128,111,104,96,88,74,73,72,64,59,55,52,43,42,38,37,36,33,32,28,27,24,21,20,18,16,12,11,10,8,7,6,5,4,3,2];\nfunction shortCorpusLabel(v){\n const h=corpusHits(v)[0];if(!h)return'';\n return h.label.split(' / ')[0]\n}\nfunction interestingMultipleDetails(n,limit=8){\n const anchorSet=new Set(CARD_ANCHORS),seen=new Set(),rows=[];\n for(const a of CARD_ANCHORS){\n  if(n<=a||n%a!==0)continue;\n  const q=n/a,lo=Math.min(a,q),hi=Math.max(a,q),key=lo+'x'+hi;\n  if(seen.has(key))continue;seen.add(key);\n  const loForms=shapes(lo).slice(0,1),hiForms=shapes(hi).slice(0,1);\n  const loHit=shortCorpusLabel(lo),hiHit=shortCorpusLabel(hi);\n  let score=0;\n  if(anchorSet.has(lo))score+=18;if(anchorSet.has(hi))score+=18;\n  if(loForms.length)score+=14;if(hiForms.length)score+=14;\n  if(loHit)score+=18;if(hiHit)score+=18;\n  if(lo===24||hi===24||lo===37||hi===37||lo===136||hi===136||lo===222||hi===222)score+=24;\n  let notes=[];\n  if(loHit)notes.push(fmt(lo)+'='+loHit);else if(loForms.length)notes.push(fmt(lo)+'='+loForms[0]);\n  if(hiHit)notes.push(fmt(hi)+'='+hiHit);else if(hiForms.length)notes.push(fmt(hi)+'='+hiForms[0]);\n  rows.push({text:`${fmt(lo)}×${fmt(hi)}${notes.length?' ('+notes.join(' · ')+')':''}`,score});\n }\n return rows.sort((x,y)=>y.score-x.score||x.text.length-y.text.length).slice(0,limit).map(x=>x.text)\n}\nfunction anchorDecompositions(n){return interestingMultipleDetails(n,8)}\n"
          assert old in s, "missing anchor: interesting multiples engine"
          s=s.replace(old,new,1)
          old=" html+=`<div class=\"fact-line\"><b>מחלקים (${a.tau}):</b> ${esc(compactDivisorText(n))}</div>`;\n if(props.length)html+=`<div class=\"fact-line\"><b>תכונות:</b> ${props.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(anchors.length)html+=`<div class=\"fact-line anchor-line\"><b>עוגנים:</b> ${anchors.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(forms.length)html+=`<div class=\"fact-line\"><b>צורות:</b> ${forms.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;"
          new=" if(props.length)html+=`<div class=\"fact-line\"><b>תכונות:</b> ${props.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(anchors.length)html+=`<div class=\"fact-line anchor-line\"><b>כפולות מעניינות:</b> ${anchors.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;\n if(forms.length)html+=`<div class=\"fact-line\"><b>צורות / כוחות:</b> ${forms.map(x=>esc(x)).join('<span class=\"fact-sep\">·</span>')}</div>`;"
          assert old in s, "missing anchor: replace divisor list"
          s=s.replace(old,new,1)
          old="function minimalResultText(r){\n const q=document.getElementById('q').value.trim();\n const breakdown=magnetBreakdown(r);\n return breakdown\n  ? `${q} = ${breakdown} = ${fmt(r.total)} (${minimalMethodName(r)})`\n  : `${q} = ${fmt(r.total)} (${minimalMethodName(r)})`\n}"
          new="function minimalResultText(r){\n const q=document.getElementById('q').value.trim();\n const breakdown=magnetBreakdown(r);\n return breakdown\n  ? `${q} = ${breakdown} = ${fmt(r.total)} (${minimalMethodName(r)})`\n  : `${q} = ${fmt(r.total)} (${minimalMethodName(r)})`\n}\nfunction richMagnetText(r){\n const base=minimalResultText(r),a=analyzeNumber(r.total);if(!a)return base;\n const lines=[base];\n const idx=a.prime?`Prime #${a.primeIndex}`:(a.compositeIndex?`Composite #${a.compositeIndex}`:'');\n lines.push([`פירוק: ${fmtFactors(a.factors)}`,idx,`φ=${fmt(a.phi)}`,`τ=${fmt(a.tau)}`,`σ=${fmt(a.sigma)}`,`rad=${fmt(a.rad)}`,`DR=${a.root}`].filter(Boolean).join(' · '));\n const mult=interestingMultipleDetails(r.total,10);if(mult.length)lines.push('כפולות מעניינות: '+mult.join(' · '));\n const forms=(a.forms||[]).concat(a.binom||[]);if(forms.length)lines.push('צורות / כוחות: '+forms.join(' · '));\n const hits=corpusHits(r.total);if(hits.length)lines.push('קורפוס: '+hits.map(h=>h.label).join(' / '));\n return lines.join('\\n')\n}\nfunction selectedPlainText(){return selectedResults().map(minimalResultText).join('\\n')}\nfunction selectedRichText(){return selectedResults().map(richMagnetText).join('\\n\\n')}\nfunction allResultsPlainText(){return current.results.map(minimalResultText).join('\\n')}\nfunction allResultsRichText(){return current.results.map(richMagnetText).join('\\n\\n')}"
          assert old in s, "missing anchor: scope magnet text functions"
          s=s.replace(old,new,1)
          old="function renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-count\">${rows.length} בחירות</div></div>`+rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><div class=\"card-actions\"><button class=\"copy-method\" data-copy-method=\"${r.method.key}\" title=\"העתק רק את הבחירה\">🧲</button><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"mn\" style=\"font-size:${compactMethodFont(r.method.name)}px\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></div>${compactFactsHtml(r.total)}<div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`).join('')}"
          new="function renderMultiDetails(rows){const pane=document.getElementById('detailPane'),grid=document.getElementById('multiDetailGrid');pane.classList.add('multi-mode');const q=document.getElementById('q').value;grid.innerHTML=`<div class=\"stage-head\"><div><div class=\"stage-title\">מרכז השוואה</div><div class=\"stage-sub\">${esc(q)}</div></div><div class=\"stage-actions\"><button data-copy-selected title=\"העתק את כל הבחירות שסומנו\">🧲</button><button class=\"math-magnet\" data-copy-selected-math title=\"העתק את כל הבחירות + מתמטיקה\">🧲∑</button><div class=\"stage-count\">${rows.length} בחירות</div></div></div>`+rows.map(r=>`<div class=\"multi-detail-card\" data-detail-method=\"${r.method.key}\"><div class=\"mh\"><div class=\"card-actions\"><button class=\"copy-rich-method\" data-copy-rich-method=\"${r.method.key}\" title=\"העתק בחירה + פירוקים ותכונות\">🧲∑</button><button class=\"copy-method\" data-copy-method=\"${r.method.key}\" title=\"העתק רק את הבחירה\">🧲</button><button class=\"remove-method\" data-remove-method=\"${r.method.key}\" title=\"הסר מהבחירה\">✕</button></div><div class=\"mn\" style=\"font-size:${compactMethodFont(r.method.name)}px\">${esc(r.method.name)}</div><div class=\"mv\">${fmt(r.total)}</div></div>${compactFactsHtml(r.total)}<div class=\"multi-breakdown\">${richBreakdownHtml(r)}</div></div>`).join('')}"
          assert old in s, "missing anchor: render scoped magnets"
          s=s.replace(old,new,1)
          old="document.getElementById('multiDetailGrid').addEventListener('click',async e=>{const c=e.target.closest('[data-copy-method]');if(c){const r=current.results.find(x=>x.method.key===c.dataset.copyMethod);if(!r)return;const ok=await copyText(minimalResultText(r));toast(ok?'הבחירה הועתקה':'שגיאה בהעתקה');return}const b=e.target.closest('[data-remove-method]');if(!b)return;const key=b.dataset.removeMethod;state.selectedMethods=state.selectedMethods.filter(k=>k!==key);if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];state.methodKey=state.selectedMethods[state.selectedMethods.length-1]||state.methodKey;renderResults()});"
          new="document.getElementById('multiDetailGrid').addEventListener('click',async e=>{\n const selMath=e.target.closest('[data-copy-selected-math]');if(selMath){const ok=await copyText(selectedRichText());toast(ok?'כל הבחירות + מתמטיקה הועתקו':'שגיאה בהעתקה');return}\n const sel=e.target.closest('[data-copy-selected]');if(sel){const ok=await copyText(selectedPlainText());toast(ok?'כל הבחירות הועתקו':'שגיאה בהעתקה');return}\n const rich=e.target.closest('[data-copy-rich-method]');if(rich){const r=current.results.find(x=>x.method.key===rich.dataset.copyRichMethod);if(!r)return;const ok=await copyText(richMagnetText(r));toast(ok?'הבחירה + מתמטיקה הועתקה':'שגיאה בהעתקה');return}\n const c=e.target.closest('[data-copy-method]');if(c){const r=current.results.find(x=>x.method.key===c.dataset.copyMethod);if(!r)return;const ok=await copyText(minimalResultText(r));toast(ok?'הבחירה הועתקה':'שגיאה בהעתקה');return}\n const b=e.target.closest('[data-remove-method]');if(!b)return;const key=b.dataset.removeMethod;state.selectedMethods=state.selectedMethods.filter(k=>k!==key);if(!state.selectedMethods.length&&state.methodKey)state.selectedMethods=[state.methodKey];state.methodKey=state.selectedMethods[state.selectedMethods.length-1]||state.methodKey;renderResults()\n});"
          assert old in s, "missing anchor: scoped magnet events"
          s=s.replace(old,new,1)
          old="document.getElementById('copyAll').addEventListener('click',async()=>{if(state.tab==='results'&&selectedResults().length){const ok=await copyText(selectedResults().map(minimalResultText).join('\\n'));toast(ok?'הבחירות הועתקו':'שגיאה בהעתקה');return}const el=activeExportTarget();const ok=await copyText(exportVisibleLines(el).join('\\n'));toast(ok?'הטאב הועתק כטקסט':'שגיאה בהעתקה')});document.getElementById('saveView').addEventListener('click',async()=>{if(state.tab==='results'&&selectedResults().length){const ok=await saveSelectedPoster();if(ok)toast('נשמרה תמונת השוואה מעוצבת');return}const el=activePanel();const name=document.getElementById('q').value+' - '+state.tab;const ok=await savePanelAsPng(el,name);if(ok)toast('נשמר צילום של הטאב')});"
          new="document.getElementById('copyAll').addEventListener('click',async()=>{if(state.tab==='results'){const ok=await copyText(allResultsPlainText());toast(ok?'כל שיטות הגימטריה הועתקו':'שגיאה בהעתקה');return}const el=activeExportTarget();const ok=await copyText(exportVisibleLines(el).join('\\n'));toast(ok?'הטאב הועתק כטקסט':'שגיאה בהעתקה')});\ndocument.getElementById('copyAllMath').addEventListener('click',async()=>{if(state.tab==='results'){const ok=await copyText(allResultsRichText());toast(ok?'כל השיטות + מתמטיקה הועתקו':'שגיאה בהעתקה');return}const el=activeExportTarget();const ok=await copyText(exportVisibleLines(el).join('\\n'));toast(ok?'הטאב הועתק כטקסט':'שגיאה בהעתקה')});\ndocument.getElementById('saveView').addEventListener('click',async()=>{if(state.tab==='results'&&selectedResults().length){const ok=await saveSelectedPoster();if(ok)toast('נשמרה תמונת השוואה מעוצבת');return}const el=activePanel();const name=document.getElementById('q').value+' - '+state.tab;const ok=await savePanelAsPng(el,name);if(ok)toast('נשמר צילום של הטאב')});"
          assert old in s, "missing anchor: restore top all + math"
          s=s.replace(old,new,1)
          old=" posterText(ctx,'מחלקים: '+compactDivisorText(r.total),x+w-28,y+126,13,'600','#cbd7e3','right','rtl',w-56);\n const props=[a.aliquot,a.squarefree?'Squarefree':'',a.powerful?'Powerful':'','DR='+a.root].filter(Boolean).join(' · ');\n posterText(ctx,'תכונות: '+props,x+w-28,y+146,13,'600','#cbd7e3','right','rtl',w-56);\n const adec=anchorDecompositions(r.total);if(adec.length)posterText(ctx,'עוגנים: '+adec.join(' · '),x+w-28,y+166,14,'650','#ffe2a0','right','rtl',w-56);\n if(hits.length>1)posterText(ctx,'קורפוס: '+hits.map(h=>h.label).join(' / '),x+w-28,y+186,13,'600','#bdf4f0','right','rtl',w-56);\n let yy=y+(hits.length>1?218:adec.length?198:178);"
          new=" const props=[a.aliquot,a.squarefree?'Squarefree':'',a.powerful?'Powerful':'','DR='+a.root].filter(Boolean).join(' · ');\n posterText(ctx,'תכונות: '+props,x+w-28,y+126,13,'600','#cbd7e3','right','rtl',w-56);\n const adec=interestingMultipleDetails(r.total,6);if(adec.length)posterText(ctx,'כפולות: '+adec.join(' · '),x+w-28,y+146,13,'650','#ffe2a0','right','rtl',w-56);\n const forms=(a.forms||[]).concat(a.binom||[]);if(forms.length)posterText(ctx,'צורות: '+forms.slice(0,4).join(' · '),x+w-28,y+166,13,'600','#cbd7e3','right','rtl',w-56);\n if(hits.length>1)posterText(ctx,'קורפוס: '+hits.map(h=>h.label).join(' / '),x+w-28,y+186,13,'600','#bdf4f0','right','rtl',w-56);\n let yy=y+(hits.length>1?218:forms.length?198:adec.length?178:158);"
          assert old in s, "missing anchor: poster interesting multiples"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore magnet scopes and add math variants"
          git push origin main
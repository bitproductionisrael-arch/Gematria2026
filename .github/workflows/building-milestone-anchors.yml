name: One-time Building Milestone Anchors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add compact Building milestone annotations
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="[14,'דוד','Hebrew Reduced / Regular'],[18,'חי','Hebrew Regular']"
          new="[13,'אחד','Hebrew Regular'],[14,'דוד','Hebrew Reduced / Regular'],[18,'חי','Hebrew Regular']"
          assert old in s, "missing anchor: add 13 anchor"
          s=s.replace(old,new,1)
          old="function isBuildingMethod(m){return !!m&&m.transform===cumulative}"
          new="function isBuildingMethod(m){return !!m&&m.transform===cumulative}\nfunction buildingMilestones(w){\n const n=w?.vals?.length||0;if(!n)return[];\n const picks=[\n  {i:0,label:'פוזיציה 1'},\n  {i:1,label:'פוזיציה 2'},\n  {i:2,label:'פוזיציה 3'},\n  {i:4,label:'פוזיציה 5'},\n  {i:n-3,label:'שתיים לפני האחרונה'},\n  {i:n-1,label:'האחרונה'}\n ];\n const seen=new Set(),out=[];\n for(const p of picks){\n  if(p.i<0||p.i>=n||seen.has(p.i))continue;seen.add(p.i);\n  const value=w.vals[p.i],hit=corpusHits(value)[0];if(!hit)continue;\n  out.push({label:p.label,value,anchor:hit.label});\n }\n return out\n}\nfunction buildingMilestoneText(w){\n const rows=buildingMilestones(w);\n return rows.length?'אבני דרך: '+rows.map(x=>`${x.label} ${fmt(x.value)}=${x.anchor}`).join(' · '):''\n}"
          assert old in s, "missing anchor: building milestone helpers"
          s=s.replace(old,new,1)
          old="else if(isBuildingMethod(m))out+=`\\nבניין / Building: ${buildingAnnotatedTerms(w).join(' + ')}\\n= ${sum(w.vals)}`;"
          new="else if(isBuildingMethod(m)){out+=`\\nבניין / Building: ${buildingAnnotatedTerms(w).join(' + ')}\\n= ${sum(w.vals)}`;const ms=buildingMilestoneText(w);if(ms)out+=`\\n${ms}`}"
          assert old in s, "missing anchor: word description milestone note"
          s=s.replace(old,new,1)
          old="else if(isBuildingMethod(m)){const bt=buildingTextTerms(w);note=`<div class=\"transform-note\"><b>בניין / Building:</b><div style=\"font-size:16px;font-weight:850;margin:5px 0;direction:ltr;text-align:left\">${bt.map(esc).join(' → ')}</div><div>${buildingAnnotatedTerms(w).map(esc).join(' + ')} = <b>${fmt(sum(w.vals))}</b></div></div>`}"
          new="else if(isBuildingMethod(m)){const bt=buildingTextTerms(w),ms=buildingMilestoneText(w);note=`<div class=\"transform-note\"><b>בניין / Building:</b><div style=\"font-size:16px;font-weight:850;margin:5px 0;direction:ltr;text-align:left\">${bt.map(esc).join(' → ')}</div><div>${buildingAnnotatedTerms(w).map(esc).join(' + ')} = <b>${fmt(sum(w.vals))}</b></div>${ms?`<div style=\"font-size:11px;opacity:.72;margin-top:5px\">${esc(ms)}</div>`:''}</div>`}"
          assert old in s, "missing anchor: html milestone note"
          s=s.replace(old,new,1)
          old=" if(isBuildingMethod(m)){\n  return buildingAnnotatedTerms(w).join(' + ')+' = '+fmt(sum(w.vals))\n }"
          new=" if(isBuildingMethod(m)){\n  const ms=buildingMilestoneText(w);\n  return buildingAnnotatedTerms(w).join(' + ')+' = '+fmt(sum(w.vals))+(ms?' | '+ms:'')\n }"
          assert old in s, "missing anchor: magnet milestone note"
          s=s.replace(old,new,1)
          old="console.assert(_malBuilding.words[0].vals.join(',')==='13,14,26,29,37,46,65,70,74,79,82','Malchisedec Building prefix sums');"
          new="console.assert(_malBuilding.words[0].vals.join(',')==='13,14,26,29,37,46,65,70,74,79,82','Malchisedec Building prefix sums');\nconsole.assert(buildingMilestoneText(_malBuilding.words[0])==='אבני דרך: פוזיציה 1 13=אחד · פוזיציה 2 14=דוד · פוזיציה 3 26=יהוה · פוזיציה 5 37=יחידה · שתיים לפני האחרונה 74=Mike · האחרונה 82=בראשית א:א','Malchisedec milestone anchors');"
          assert old in s, "missing anchor: milestone self test"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Annotate Building milestone anchors"
          git push origin main
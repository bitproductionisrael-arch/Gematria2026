name: One-time Number Legend Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add math explanations and Blaze 528 anchor
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          replacements = {
            "[528,'מייק רוב מייק','Hebrew Regular']":
              "[528,'BLAZE / מייק רוב מייק','Agrippa / Hebrew Regular']",

            "en:['Amit','Mike','Rov','Amit Mike Rov','Amit M Rov','Amit M. Rov']":
              "en:['Amit','Mike','Rov','Blaze','Amit Mike Rov','Amit M Rov','Amit M. Rov']",

            "kv('φ(n)',fmt(a.phi)),kv('λ(n)',fmt(a.lambda)),kv('τ(n)',fmt(a.tau)),kv('σ(n)',fmt(a.sigma)),kv('rad(n)',fmt(a.rad)),kv('ω(n)',fmt(a.omega)),kv('Ω(n)',fmt(a.Omega))":
              "kv('φ(n) (מספר הזרים ל-n)',fmt(a.phi)),kv('λ(n) (מחזור הכפל המינימלי)',fmt(a.lambda)),kv('τ(n) (מספר כל המחלקים)',fmt(a.tau)),kv('σ(n) (סכום כל המחלקים)',fmt(a.sigma)),kv('rad(n) (מכפלת הראשוניים השונים)',fmt(a.rad)),kv('ω(n) (מספר ראשוניים שונים)',fmt(a.omega)),kv('Ω(n) (ראשוניים כולל חזרות)',fmt(a.Omega))",

            "kv('φ-chain',a.phiChain.join(' → ')),kv('Class',a.aliquot),kv('Squarefree',a.squarefree?'כן':'לא'),kv('Powerful',a.powerful?'כן':'לא')":
              "kv('φ-chain (שרשרת φ עד 1)',a.phiChain.join(' → ')),kv('Class (סיווג סכום מחלקים)',a.aliquot),kv('Squarefree (בלי גורם בריבוע)',a.squarefree?'כן':'לא'),kv('Powerful (כל ראשוני בריבוע)',a.powerful?'כן':'לא')",

            "kv('gcd(n,24)',fmt(gcd(a.n,24))),kv('gcd(n,36)',fmt(gcd(a.n,36))),kv('gcd(n,37)',fmt(gcd(a.n,37))),kv('lcm(n,24)',fmt(lcm(a.n,24))),kv('lcm(n,37)',fmt(lcm(a.n,37)))":
              "kv('gcd(n,24) (מחלק משותף גדול)',fmt(gcd(a.n,24))),kv('gcd(n,36) (מחלק משותף גדול)',fmt(gcd(a.n,36))),kv('gcd(n,37) (מחלק משותף גדול)',fmt(gcd(a.n,37))),kv('lcm(n,24) (כפולה משותפת קטנה)',fmt(lcm(a.n,24))),kv('lcm(n,37) (כפולה משותפת קטנה)',fmt(lcm(a.n,37)))",

            "kv('mod 24',a.mods[24]),kv('mod 36',a.mods[36]),kv('mod 37',a.mods[37]),kv('mod 72',a.mods[72]),kv('mod 9',a.mods[9]),kv('mod 11',a.mods[11])":
              "kv('mod 24 (שארית בחלוקה ל-24)',a.mods[24]),kv('mod 36 (שארית בחלוקה ל-36)',a.mods[36]),kv('mod 37 (שארית בחלוקה ל-37)',a.mods[37]),kv('mod 72 (שארית בחלוקה ל-72)',a.mods[72]),kv('mod 9 (שארית בחלוקה ל-9)',a.mods[9]),kv('mod 11 (שארית בחלוקה ל-11)',a.mods[11])",

            "[kv('φ(n)',fmt(a.phi)),kv('τ(n)',fmt(a.tau))":
              "[kv('φ(n) (מספר הזרים ל-n)',fmt(a.phi)),kv('τ(n) (מספר כל המחלקים)',fmt(a.tau))",

            "kv('rad(n)',fmt(a.rad))":
              "kv('rad(n) (מכפלת הראשוניים השונים)',fmt(a.rad))"
          }

          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed += 1

          if changed < 6:
              raise SystemExit(f"Only {changed} expected replacements applied")

          p.write_text(s, encoding="utf-8")
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Explain number-theory symbols and add BLAZE 528 anchor"
          git push origin main

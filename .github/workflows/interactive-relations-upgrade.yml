name: One-time Interactive Relations Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upgrade relation engine and clickable detail viewer
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old_css=".toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#131c26;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}"
          new_css=""".relation-row{cursor:pointer;transition:.15s}.relation-row:hover{border-color:#5b6a7c;background:#121b25}
.relation-modal{position:fixed;inset:0;z-index:50;background:rgba(2,6,10,.78);display:none;align-items:center;justify-content:center;padding:18px}
.relation-modal.open{display:flex}.relation-card{width:min(1180px,96vw);height:min(760px,92vh);background:#0f151d;border:1px solid #566273;border-radius:16px;padding:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:9px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.relation-card-head{display:flex;align-items:center;gap:8px}.relation-card-head .grow{flex:1;min-width:0}.relation-card-title{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.relation-card-actions{display:flex;gap:6px}
.relation-why{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.relation-detail-grid{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}.relation-side{min-width:0;min-height:0;background:#0b1118;border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto}.relation-side h3{margin:0 0 7px;font-size:13px}.relation-pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.55;direction:rtl;text-align:right}
@media(max-width:700px){.relation-modal{padding:7px}.relation-card{width:99vw;height:95vh}.relation-detail-grid{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#131c26;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}"""
          if old_css not in s:
              raise SystemExit("toast CSS anchor missing")
          s=s.replace(old_css,new_css,1)

          old_html='  <div id="toast" class="toast" aria-live="polite"></div>'
          new_html="""  <div id="relationModal" class="relation-modal" aria-hidden="true">
    <div id="relationCard" class="relation-card">
      <div class="relation-card-head">
        <div class="grow"><div id="relationDetailTitle" class="relation-card-title"></div><div id="relationDetailSub" class="tiny"></div></div>
        <div class="relation-card-actions"><button id="copyRelation" class="iconbtn" title="העתק פירוט קשר">🧲</button><button id="saveRelation" class="iconbtn" title="צלם קשר">📸</button><button id="closeRelation" class="iconbtn" title="סגור">✕</button></div>
      </div>
      <div id="relationDetailWhy" class="relation-why"></div>
      <div class="relation-detail-grid">
        <div class="relation-side"><h3 id="relationLeftTitle"></h3><pre id="relationLeftBody" class="relation-pre"></pre></div>
        <div class="relation-side"><h3 id="relationRightTitle"></h3><pre id="relationRightBody" class="relation-pre"></pre></div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>"""
          if old_html not in s:
              raise SystemExit("toast HTML anchor missing")
          s=s.replace(old_html,new_html,1)

          old_pair="""function pairRelations(a,b,allVals){a=Math.abs(Math.trunc(a));b=Math.abs(Math.trunc(b));if(!a||!b)return[];const rel=[];if(a===b)rel.push(['שוויון',100]);if(totient(a)===b)rel.push([`φ(${a})=${b}`,96]);if(totient(b)===a)rel.push([`φ(${b})=${a}`,96]);if(a!==b&&totient(a)===totient(b))rel.push([`אותו φ = ${totient(a)}`,92]);if(primeIndex(a)===b)rel.push([`${a}=Prime #${b}`,90]);if(primeIndex(b)===a)rel.push([`${b}=Prime #${a}`,90]);if(compositeIndex(a)===b)rel.push([`${a}=Composite #${b}`,90]);if(compositeIndex(b)===a)rel.push([`${b}=Composite #${a}`,90]);if(Math.abs(a-b)===1000)rel.push(['הפרש 1000',84]);if(stripZeros(a)===b||stripZeros(b)===a)rel.push(['zero-strip',82]);if(reverseDigits(a)===b&&a!==b)rel.push(['היפוך ספרות',80]);if(a%b===0||b%a===0)rel.push([`חלוקה שלמה ×${Math.max(a,b)/Math.min(a,b)}`,72]);const g=gcd(a,b);if(g>1&&a!==b)rel.push([`gcd=${g}`,40]);const set=new Set(allVals);const s=a+b,d=Math.abs(a-b);if(set.has(s)&&s!==a&&s!==b)rel.push([`סכום→${s}`,65]);if(d&&set.has(d)&&d!==a&&d!==b)rel.push([`הפרש→${d}`,65]);return rel}"""
          new_pair="""const IMPORTANT_REL_FACTORS=new Set([18,21,24,27,32,36,37,42,55,64,72,73,88,111,136,222]);
function meaningfulRatio(a,b){
 const hi=Math.max(a,b),lo=Math.min(a,b);if(!lo||hi%lo!==0)return null;const q=hi/lo;if(q<=1)return null;
 if(IMPORTANT_REL_FACTORS.has(q))return `יחס ×${q} · עוגן מבני`;
 const fs=shapes(q).filter(x=>!/^(F|L)/.test(x));
 if(q>=10&&fs.length)return `יחס ×${q} · ${fs.slice(0,2).join(' / ')}`;
 const hit=corpusHits(q)[0];if(q>=10&&hit)return `יחס ×${q} · ${hit.label}`;
 return null;
}
function structurallyInteresting(n){return !!(corpusHits(n).length||IMPORTANT_REL_FACTORS.has(n)||(n>=10&&shapes(n).length))}
function pairRelations(a,b,allVals){
 a=Math.abs(Math.trunc(a));b=Math.abs(Math.trunc(b));if(!a||!b)return[];
 const rel=[];
 if(a===b)rel.push(['שוויון מוחלט',100]);
 if(totient(a)===b)rel.push([`φ(${a})=${b}`,96]);
 if(totient(b)===a)rel.push([`φ(${b})=${a}`,96]);
 if(a!==b&&totient(a)===totient(b))rel.push([`אותו φ = ${totient(a)}`,92]);
 if(primeIndex(a)===b)rel.push([`${a}=Prime #${b}`,90]);
 if(primeIndex(b)===a)rel.push([`${b}=Prime #${a}`,90]);
 if(compositeIndex(a)===b)rel.push([`${a}=Composite #${b}`,90]);
 if(compositeIndex(b)===a)rel.push([`${b}=Composite #${a}`,90]);
 if(reverseDigits(a)===b&&a!==b)rel.push(['היפוך ספרות מלא',88]);
 if(stripZeros(a)===b||stripZeros(b)===a)rel.push(['zero-strip מדויק',84]);
 if(Math.abs(a-b)===1000)rel.push(['הפרש מדויק 1000',82]);
 const ratio=meaningfulRatio(a,b);if(ratio)rel.push([ratio,78]);
 const set=new Set(allVals),sm=a+b,df=Math.abs(a-b);
 if(set.has(sm)&&sm!==a&&sm!==b&&structurallyInteresting(sm))rel.push([`סכום מבני → ${sm}`,72]);
 if(df&&set.has(df)&&df!==a&&df!==b&&structurallyInteresting(df))rel.push([`הפרש מבני → ${df}`,72]);
 return rel;
}"""
          if old_pair not in s:
              raise SystemExit("pairRelations anchor missing")
          s=s.replace(old_pair,new_pair,1)

          old_state="const state={tab:'results',category:'base',methodKey:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true};"
          new_state="const state={tab:'results',category:'base',methodKey:null,word:0,numKey:null,numSub:'core',relPage:0,cmpPage:0,repeatPage:0,formView:'milui',compareAuto:true,relationRows:[],relationOpen:null};"
          if old_state not in s:
              raise SystemExit("state anchor missing")
          s=s.replace(old_state,new_state,1)

          old_render_start="function renderRelations(){const H=harmony(current.results),rels=buildRelations(current.results);"
          new_render_start="function renderRelations(){const H=harmony(current.results),rels=buildRelations(current.results);state.relationRows=rels;"
          if old_render_start not in s:
              raise SystemExit("renderRelations start missing")
          s=s.replace(old_render_start,new_render_start,1)

          old_row="""return `<div class="relation-row"><div><div class="pair">${fmt(x.a.total)} ↔ ${fmt(x.b.total)}</div><div class="why">${esc(x.rels.map(r=>r[0]).join(' · '))}</div></div><div class="tiny">${esc(x.a.method.key)} ↔ ${esc(x.b.method.key)}</div></div>`"""
          new_row="""return `<div class="relation-row" data-relidx="${state.relPage*per+i}" title="לחץ לפירוט מלא"><div><div class="pair">${fmt(x.a.total)} ↔ ${fmt(x.b.total)}</div><div class="why">${esc(x.rels.map(r=>r[0]).join(' · '))}</div></div><div class="tiny">${esc(x.a.method.name)} ↔ ${esc(x.b.method.name)}</div></div>`"""
          if old_row not in s:
              raise SystemExit("relation row anchor missing")
          s=s.replace(old_row,new_row,1)

          insert_anchor="function refreshAutoCompareTarget(){"
          detail_js="""function relationRuleText(r){
 const m=r.method;
 if(r.milui)return 'חוק: פירוק כל אות לשם המלא שלה וסכימת האותיות.';
 if(m.sub)return 'חוק: החלפת כל אות לפי טבלת הצופן של השיטה, ואז סכימת הערכים.';
 if(m.key==='positional')return 'חוק: ערך כל אות מוכפל במיקום שלה בתוך המילה.';
 if(m.transformName)return `חוק: ${m.transformName} על סדר ערכי האותיות.`;
 if(m.fold==='word')return 'חוק: סכום כל מילה ולאחר מכן צמצום של אותה מילה.';
 if(m.post)return 'חוק: סכום בסיס ולאחר מכן תוספת קבועה של השיטה.';
 return 'חוק: סכום ערכי האותיות לפי טבלת השיטה.';
}
function relationFullBreakdown(r){
 const out=[relationRuleText(r),''];
 if(!r.words?.length)return out.concat(['אין פירוק אותיות זמין.']).join('\n');
 for(let i=0;i<r.words.length;i++){out.push(wordDescription(r,i));if(i<r.words.length-1)out.push('');}
 return out.join('\n');
}
function openRelationDetail(idx){
 const x=state.relationRows[idx];if(!x)return;state.relationOpen=x;
 const exact=x.a.total===x.b.total;
 document.getElementById('relationDetailTitle').textContent=`${x.a.method.name} ↔ ${x.b.method.name}`;
 document.getElementById('relationDetailSub').textContent=`${fmt(x.a.total)} ↔ ${fmt(x.b.total)}`;
 document.getElementById('relationDetailWhy').innerHTML=`<span class="badge ${exact?'green':'cyan'}">✓ ${exact?'שוויון מאומת':'קשר מתמטי מאומת'}</span>`+x.rels.map(r=>`<span class="badge gold">${esc(r[0])}</span>`).join('');
 document.getElementById('relationLeftTitle').textContent=`${x.a.method.name} = ${fmt(x.a.total)}`;
 document.getElementById('relationRightTitle').textContent=`${x.b.method.name} = ${fmt(x.b.total)}`;
 document.getElementById('relationLeftBody').textContent=relationFullBreakdown(x.a);
 document.getElementById('relationRightBody').textContent=relationFullBreakdown(x.b);
 const modal=document.getElementById('relationModal');modal.classList.add('open');modal.setAttribute('aria-hidden','false');
}
function closeRelationDetail(){const modal=document.getElementById('relationModal');modal.classList.remove('open');modal.setAttribute('aria-hidden','true');state.relationOpen=null}
function relationPlainText(){
 const x=state.relationOpen;if(!x)return '';
 return [x.a.method.name+' = '+x.a.total,x.b.method.name+' = '+x.b.total,'',x.rels.map(r=>r[0]).join(' · '),'',relationFullBreakdown(x.a),'',relationFullBreakdown(x.b)].join('\n');
}

"""
          if insert_anchor not in s:
              raise SystemExit("detail insertion anchor missing")
          s=s.replace(insert_anchor,detail_js+insert_anchor,1)

          event_anchor="document.getElementById('relPrev').addEventListener('click',()=>{state.relPage=Math.max(0,state.relPage-1);renderRelations()});document.getElementById('relNext').addEventListener('click',()=>{state.relPage++;renderRelations()});"
          event_new=event_anchor+"""document.getElementById('relationList').addEventListener('click',e=>{const row=e.target.closest('[data-relidx]');if(!row)return;openRelationDetail(Number(row.dataset.relidx))});document.getElementById('closeRelation').addEventListener('click',closeRelationDetail);document.getElementById('relationModal').addEventListener('click',e=>{if(e.target.id==='relationModal')closeRelationDetail()});document.getElementById('copyRelation').addEventListener('click',async()=>{const ok=await copyText(relationPlainText());toast(ok?'פירוט הקשר הועתק':'שגיאה בהעתקה')});document.getElementById('saveRelation').addEventListener('click',async()=>{const x=state.relationOpen;if(!x)return;const ok=await savePanelAsPng(document.getElementById('relationCard'),`relation - ${x.a.total} - ${x.b.total}`);if(ok)toast('נשמר צילום קשר מאומת')});"""
          if event_anchor not in s:
              raise SystemExit("relation event anchor missing")
          s=s.replace(event_anchor,event_new,1)

          p.write_text(s,encoding="utf-8")
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make relations clickable and tighten relation matching"
          git push origin main

name: One-time Milui Mayim fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct Vav spelling in Milui Mayim
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "const MILUI_NAMES_MAYIM={...MILUI_NAMES,'מ':'מים','ת':'תיו'}; // מחקר: מ→מים ות→תיו; נשמר בנפרד מן המילוי הסטנדרטי."
          new = "const MILUI_NAMES_MAYIM={...MILUI_NAMES,'מ':'מים','ו':'ויו','ת':'תיו'}; // מחקר: מ→מים, ו→ויו, ת→תיו; נשמר בנפרד מן המילוי הסטנדרטי."
          if old not in s and "'ו':'ויו'" not in s:
              raise SystemExit("Expected Milui Mayim mapping not found")
          s = s.replace(old, new)
          s = s.replace("מילוי מים · מ→מים, ת→תיו (מחקר)", "מילוי מים · מ→מים, ו→ויו, ת→תיו (מחקר)")
          s = s.replace("מילוי מים (מ→מים) / Research", "מילוי מים (מ→מים, ו→ויו, ת→תיו) / Research")
          p.write_text(s, encoding="utf-8")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix Milui Mayim Vav spelling to ויו"
          git push origin main

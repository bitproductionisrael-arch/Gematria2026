<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#071827"/><g font-family="Arial, sans-serif"><text x="550" y="50" text-anchor="middle" font-size="32" fill="#f3c46b">פולינום התיבה  |  הגדלה פי 2</text><text x="250" y="122" text-anchor="middle" font-size="30" fill="#ecf7ff">4 × 10 × 13</text><text x="830" y="122" text-anchor="middle" font-size="30" fill="#ecf7ff">8 × 20 × 26</text><polygon points="135,220 320,220 320,353.2 135,353.2" fill="#235e91" stroke="#9dc2e0" stroke-width=".7"/><polygon points="201.6,168.2 386.6,168.2 320,220 135,220" fill="#4a96c6" stroke="#9dc2e0" stroke-width=".7"/><polygon points="320,220 386.6,168.2 386.6,301.4 320,353.2" fill="#be833d" stroke="#9dc2e0" stroke-width=".7"/><polygon points="705,185 965,185 965,372.2 705,372.2" fill="#235e91" stroke="#9dc2e0" stroke-width=".7"/><polygon points="798.6,112.19999999999999 1058.6,112.19999999999999 965,185 705,185" fill="#4a96c6" stroke="#9dc2e0" stroke-width=".7"/><polygon points="965,185 1058.6,112.19999999999999 1058.6,299.4 965,372.2" fill="#be833d" stroke="#9dc2e0" stroke-width=".7"/><text x="540" y="293" text-anchor="middle" font-size="40" fill="#f3c46b">× 2</text><text x="550" y="485" text-anchor="middle" font-size="22" fill="#f3c46b">27 → 54 (×2)      222 → 888 (×4)      520 → 4160 (×8)</text><text x="550" y="529" text-anchor="middle" font-size="20" fill="#ecf7ff">Q(x)=1+27x+222x²+520x³</text><text x="550" y="562" text-anchor="middle" font-size="20" fill="#ecf7ff">Q(2x)=1+54x+888x²+4160x³</text></g></svg>
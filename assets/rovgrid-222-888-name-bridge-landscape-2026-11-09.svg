<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" role="img" aria-label="RovGrid 222 and 888 horizontal visualizer; Amit Mike Rov on left, David Rov on right">
<rect width="1600" height="830" rx="32" fill="#08111d"/>
<rect x="24" y="20" width="1552" height="96" rx="23" fill="#111d2c" stroke="#34475b"/>
<g text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">
<text x="800" y="75" fill="#f5f9ff" font-size="39" font-weight="700">222 × 2² = 888</text>
<rect x="24" y="133" width="763" height="531" rx="23" fill="#10253a" stroke="#3899df" stroke-width="3"/>
<rect x="813" y="133" width="763" height="531" rx="23" fill="#102d25" stroke="#24bc80" stroke-width="3"/>
<g font-family="Arial,DejaVu Sans,sans-serif" font-size="40" font-weight="700" fill="#fff" direction="rtl">
<text x="406" y="190">עמית מייק רוב</text><text x="1194" y="190">דוד רוב</text>
</g>
<text x="406" y="300" font-size="95" fill="#59b8ff" font-weight="700">888</text>
<text x="1194" y="300" font-size="95" fill="#52e2a4" font-weight="700">222</text>
<rect x="66" y="330" width="678" height="115" rx="18" fill="#192e41"/>
<rect x="855" y="330" width="678" height="115" rx="18" fill="#192e35"/>
<text x="406" y="383" font-size="41" fill="#fff">22² + 20² + 2²</text>
<text x="1194" y="383" font-size="41" fill="#fff">11² + 10² + 1²</text>
<text x="406" y="425" font-size="30" fill="#d4e0ec">484 + 400 + 4</text>
<text x="1194" y="425" font-size="30" fill="#d4e0ec">121 + 100 + 1</text>
<text x="406" y="503" font-size="34" fill="#59b8ff" font-weight="700">22 + 20 + 2 = 44</text>
<text x="1194" y="503" font-size="34" fill="#52e2a4" font-weight="700">11 + 10 + 1 = 22</text>
<text x="406" y="548" font-size="27" fill="#dce9f3">520 + 160 + 208 = 888</text>
<text x="1194" y="548" font-size="27" fill="#dce9f3">14 + 208 = 222</text>
<text x="406" y="605" font-size="29" fill="#87caff">8 × 20 × 26</text>
<text x="1194" y="605" font-size="29" fill="#89e8b6">4 × 10 × 13</text>
<text x="406" y="639" font-size="23" fill="#dce9f3">160 + 208 + 520 = 888</text>
<text x="1194" y="639" font-size="23" fill="#dce9f3">40 + 52 + 130 = 222</text>
<rect x="24" y="686" width="1552" height="57" rx="13" fill="#19293a" stroke="#344f66"/>
<text x="800" y="725" fill="#fff" font-size="33" font-weight="700">222 × 4 = 888</text>
<rect x="24" y="762" width="1552" height="54" rx="12" fill="#111e2e" stroke="#344f66"/>
<text x="260" y="784" fill="#b5d5f7" font-size="17">520</text>
<text x="420" y="784" fill="#b5d5f7" font-size="17">160</text>
<text x="800" y="808" fill="#87e7b7" font-size="19">5+2+0 + 1+6+0 = 14</text>
</g>
<g font-family="Arial,sans-serif" direction="rtl" text-anchor="middle" fill="#b5d5f7" font-size="18">
<text x="196" y="784">עמית</text><text x="355" y="784">מייק</text>
<text x="1087" y="808" fill="#87e7b7">דוד</text><text x="507" y="808" fill="#87e7b7">צמצום:</text>
</g></svg>

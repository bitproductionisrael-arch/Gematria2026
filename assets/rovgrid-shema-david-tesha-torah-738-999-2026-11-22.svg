<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>עמית והתורה — עוגני 16 61 161 611 616</title><desc>גרסה וקטורית עצמאית המבוססת על הערכים המאומתים, לא עותק של PNG.</desc><rect width="1600" height="900" fill="#06162c"/><g font-family="Arial, DejaVu Sans, sans-serif" font-weight="bold"><text x="800" y="75" font-size="54" fill="#f6d77d" text-anchor="middle" direction="rtl" unicode-bidi="embed">עמית</text><rect x="40" y="110" width="296" height="165" rx="18" fill="#0b2344" stroke="#dbb458" stroke-width="2"/><text x="188" y="193" font-size="70" fill="#f6d77d" text-anchor="middle">16</text><text x="188" y="243" font-size="25" fill="#e7edf8" text-anchor="middle" direction="rtl" unicode-bidi="embed">״עמית״ (קטנה)</text><rect x="346" y="110" width="296" height="165" rx="18" fill="#0b2344" stroke="#dbb458" stroke-width="2"/><text x="494" y="193" font-size="70" fill="#f6d77d" text-anchor="middle">61</text><text x="494" y="243" font-size="25" fill="#e7edf8" text-anchor="middle" direction="rtl" unicode-bidi="embed">״עמית״ (סדרית)</text><rect x="652" y="110" width="296" height="165" rx="18" fill="#0b2344" stroke="#dbb458" stroke-width="2"/><text x="800" y="193" font-size="70" fill="#f6d77d" text-anchor="middle">161</text><text x="800" y="243" font-size="25" fill="#e7edf8" text-anchor="middle" direction="rtl" unicode-bidi="embed">״אלפים״</text><rect x="958" y="110" width="296" height="165" rx="18" fill="#0b2344" stroke="#dbb458" stroke-width="2"/><text x="1106" y="193" font-size="70" fill="#f6d77d" text-anchor="middle">611</text><text x="1106" y="243" font-size="25" fill="#e7edf8" text-anchor="middle" direction="rtl" unicode-bidi="embed">״תורה״</text><rect x="1264" y="110" width="296" height="165" rx="18" fill="#0b2344" stroke="#dbb458" stroke-width="2"/><text x="1412" y="193" font-size="70" fill="#f6d77d" text-anchor="middle">616</text><text x="1412" y="243" font-size="25" fill="#e7edf8" text-anchor="middle" direction="rtl" unicode-b
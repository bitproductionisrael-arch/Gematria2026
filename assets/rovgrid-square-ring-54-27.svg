<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#071827"/><g font-family="Arial, sans-serif"><text x="550" y="48" text-anchor="middle" font-size="31" fill="#f3c46b">D4  |  4 × 54 = 8 × 27 = 216</text><polygon points="70,98 272.5,98 272.5,105.36363636363636 77.36363636363636,105.36363636363636" fill="#2b70aa" stroke="#9dc2e0" stroke-width=".7"/><polygon points="272.5,98 475,98 467.6363636363636,105.36363636363636 272.5,105.36363636363636" fill="#468cbd" stroke="#9dc2e0" stroke-width=".7"/><polygon points="475,98 475,300.5 467.6363636363636,300.5 467.6363636363636,105.36363636363636" fill="#4b8dc1" stroke="#9dc2e0" stroke-width=".7"/><polygon points="475,300.5 475,503 467.6363636363636,495.6363636363636 467.6363636363636,300.5" fill="#74acdc" stroke="#9dc2e0" stroke-width=".7"/><polygon points="475,503 272.5,503 272.5,495.6363636363636 467.6363636363636,495.6363636363636" fill="#2b70aa" stroke="#9dc2e0" stroke-width=".7"/><polygon points="272.5,503 70,503 77.36363636363636,495.6363636363636 272.5,495.6363636363636" fill="#468cbd" stroke="#9dc2e0" stroke-width=".7"/><polygon points="70,503 70,300.5 77.36363636363636,300.5 77.36363636363636,495.6363636363636" fill="#4b8dc1" stroke="#9dc2e0" stroke-width=".7"/><polygon points="70,300.5 70,98 77.36363636363636,105.36363636363636 77.36363636363636,300.5" fill="#74acdc" stroke="#9dc2e0" stroke-width=".7"/><polygon points="77.36363636363636,105.36363636363636 467.6363636363636,105.36363636363636 467.6363636363636,495.6363636363636 77.36363636363636,495.6363636363636" fill="#112f43" stroke="#9dc2e0" stroke-width=".7"/><text x="274" y="544" text-anchor="middle" font-size="26" fill="#ecf7ff">55² − 53² = 216</text><text x="792" y="168" text-anchor="middle" font-size="34" fill="#f3c46b">4 טרפזים × 54</text><text x="792" y="245" text-anchor="middle" font-size="34" fill="#f3c46b">8 חצאים × 27</text><text x="792" y="339" text-anchor="middle" font-size="23" fill="#ecf7ff">עובי המסגרת = 1</text><text x="792" y="404" text-anchor="middle" font-size="23" fill="#ecf7ff">סימטריית ריבוע D4</text><text x="792" y="474" text-anchor="middle" font-size="20" fill="#ecf7ff">מצויר בקנה מידה</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 770" role="img" aria-label="RovGrid three faces and fourth axes, minimal factors 1 5 13, closing 65 times 52 times 80 equals 520 squared">
<rect width="1440" height="770" fill="#080e1c"/>
<text x="720" y="64" font-size="38" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" fill="#edf5ff">ROVGRID  ·  THREE FACES  ·  FOURTH AXIS</text>
<text x="720" y="99" font-size="20" text-anchor="middle" font-family="Arial,sans-serif" fill="#97b6df">Minimal integer expansion of (8, 20, 26) · 07.11.2026</text>
<g font-family="Arial,sans-serif">
<rect x="34" y="135" rx="20" width="438" height="480" fill="#11213a" stroke="#2861a7" stroke-width="2"/>
<rect x="501" y="135" rx="20" width="438" height="480" fill="#11213a" stroke="#2d83a4" stroke-width="2"/>
<rect x="968" y="135" rx="20" width="438" height="480" fill="#11213a" stroke="#6b73b8" stroke-width="2"/>
<g text-anchor="middle">
<text x="253" y="191" fill="#ffffff" font-size="34" font-weight="bold">AMIT · 520</text>
<text x="720" y="191" fill="#ffffff" font-size="34" font-weight="bold">ROV · 208</text>
<text x="1187" y="191" fill="#ffffff" font-size="34" font-weight="bold">MIKE · 160</text>
<text x="253" y="226" fill="#9dbcf1" font-size="22">Scale ×1  ·  New axis 65</text>
<text x="720" y="226" fill="#9bd4e0" font-size="22">Scale ×5  ·  New axis 52</text>
<text x="1187" y="226" fill="#bbbdf9" font-size="22">Scale ×13  ·  New axis 80</text>
</g>
<g fill="#dcecff" font-size="26" text-anchor="middle">
<text x="253" y="291">8 × 65 = 520</text><text x="253" y="333">20 × 26 = 520</text>
<text x="720" y="291">40 × 130 = 5200</text><text x="720" y="333">100 × 52 = 5200</text>
<text x="1187" y="291">104 × 260 = 27040</text><text x="1187" y="333">338 × 80 = 27040</text>
</g>
<g stroke="#537eab" stroke-width="2"><line x1="77" y1="362" x2="429" y2="362"/><line x1="544" y1="362" x2="896" y2="362"/><line x1="1011" y1="362" x2="1363" y2="362"/></g>
<g font-size="20" text-anchor="middle" fill="#c0cee3">
<text x="253" y="412">8 × 20 × 26 × 65</text><text x="720" y="412">40 × 100 × 130 × 52</text><text x="1187" y="412">104 × 260 × 338 × 80</text>
</g>
<g font-size="33" text-anchor="middle" fill="#ffffff" font-weight="bold">
<text x="253" y="464">= 520²</text><text x="720" y="464">= 5200²</text><text x="1187" y="464">= 27040²</text>
</g>
<g font-size="21" text-anchor="middle" fill="#9dbcf1">
<text x="253" y="519">GCD(8,520) = 8</text><text x="720" y="519">GCD(20,208) = 4</text><text x="1187" y="519">GCD(26,160) = 2</text>
<text x="253" y="554">65 = 520 / 8</text><text x="720" y="554">52 = 208 / 4</text><text x="1187" y="554">80 = 160 / 2</text>
</g>
<rect x="35" y="636" width="1370" height="99" rx="15" fill="#03529D"/>
<text x="720" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="45" font-weight="bold" fill="#ffffff">65 × 52 × 80 = 520² = 270,400</text>
<text x="720" y="753" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#9aacc7">Pair-product schematic; not an Euclidean projection of a 4D solid · exact integer arithmetic</text>
</g>
</svg>

<text x="280" y="226" font-size="26" fill="#bde0ff" direction="rtl">קובייה: צלעות מקור</text>
<text x="800" y="226" font-size="26" fill="#a4ece7" direction="rtl">פולינום פחות פאה</text>
<text x="1320" y="226" font-size="26" fill="#aaf2c8" direction="rtl">צמצום השמות</text>
<text x="280" y="305" font-size="54" fill="#fff" font-weight="bold">4 + 10</text>
<text x="800" y="305" font-size="54" fill="#fff" font-weight="bold">222 − 208</text>
<text x="1320" y="305" font-size="54" fill="#fff" font-weight="bold">7 + 7</text>
<text x="280" y="388" font-size="70" fill="#71bfff" font-weight="bold">14</text>
<text x="800" y="388" font-size="70" fill="#7edfe0" font-weight="bold">14</text>
<text x="1320" y="388" font-size="70" fill="#65e4a2" font-weight="bold">14</text>
<rect x="36" y="465" width="1528" height="118" rx="20" fill="#203048" stroke="#405971"/>
<text x="800" y="505" font-size="24" fill="#c5d2e1" direction="rtl">השלמת צלע שלישית מתוך תנאי סגירה</text>
<text x="800" y="553" font-size="40" fill="#fff" font-weight="bold">40 + 14c − 16c = 14  →  c = 13</text>
<rect x="35" y="608" width="750" height="203" rx="22" fill="#1d2736" stroke="#537ca3"/>
<rect x="815" y="608" width="750" height="203" rx="22" fill="#203629" stroke="#62c295"/>
<text x="410" y="655" font-size="26" fill="#bfdbef" direction="rtl">מה שנגרע בצמצום</text>
<text x="1190" y="655" font-size="26" fill="#c1e9d0" direction="rtl">מה שנשאר ללא שינוי</text>
<text x="410" y="719" font-size="49" fill="#f6f9fd" font-weight="bold">513 + 153 = 666</text>
<text x="1190" y="719" font-size="49" fill="#f6f9fd" font-weight="bold">7 + 7 + 208 = 222</text>
<text x="410" y="774" font-size="26" fill="#bfd7ed">520−7=513 | 160−7=153</text>
<text x="1190" y="774" font-size="26" fill="#b8e8ce">14 = David | 208 = Rov</text>
<text x="800" y="863" font-size="47" fill="#65e4a2" font-weight="bold">666 + 222 = 888 = 37 × 4!</text>
</g>

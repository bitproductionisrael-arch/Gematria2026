<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Triple constructive closure 14, 222, 666 and 888 in RovGrid">
<rect width="1600" height="900" rx="34" fill="#08111d"/>
<g font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle">
<text x="800" y="75" font-size="49" fill="#f4f8ff" font-weight="bold" direction="rtl">משפט הסגירה המשולשת</text>
<text x="800" y="133" font-size="44" fill="#55e9a7" font-weight="bold">4 + 10 = 222 − 208 = 7 + 7 = 14</text>
</g>
<g font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle">
<rect x="35" y="179" width="490" height="264" rx="22" fill="#122c3e" stroke="#4ca6f6" stroke-width="2"/>
<rect x="555" y="179" width="490" height="264" rx="22" fill="#162b36" stroke="#59c6c5" stroke-width="2"/>
